DwkJzYz2hz6/wqZCBcTXc9Py9Z/9k=\" alt=\"KanFit, een digitale interventie voor een actieve levensstijl na kanker\"><p>Bedankt om deel te nemen aan deze online workshop.</p><p>Deze workshop maakt deel uit van het KanFit-project (<a href=\"https://www.crig.ugent.be/en/emma-tack\" target=\"_blank\" rel=\"noopener\">www.crig.ugent.be/en/emma-tack</a>). Met dit project willen we een digitale interventie ontwikkelen, genaamd <b>KanFit</b>, die mensen ondersteunt in het aannemen van een actieve levensstijl na kanker. Dit onderzoek is mogelijk dankzij Kom op tegen Kanker (KOTK) en het Fonds Wetenschappelijk Onderzoek (FWO).</p><p>Jouw ervaring als persoon die kanker heeft gehad, is belangrijk om ervoor te zorgen dat KanFit goed aansluit bij de dagelijkse realiteit van mensen na kanker.</p><h3>Huidige workshop</h3><p>De workshop richt zich op het identificeren en valideren van kankerspecifieke barrières voor fysieke activiteit en mogelijke strategieën om met deze barrières om te gaan.</p><p>We zijn benieuwd naar jouw persoonlijke ervaring en mening. Het gaat dus niet om wat volgens jou medisch gezien juist of fout is, maar om wat jij herkent, relevant vindt en denkt dat in de praktijk zou kunnen helpen.</p><p>Je doorloopt de workshop op eigen tempo. Je kunt pauzeren en de workshop op een later moment hervatten. De geschatte tijd van de workshop is ongeveer 1 uur.</p>"}, {"id": "achtergrond", "nav": "Over jou", "level": 1, "kind": "background", "title": "Ex-kankerpatiënten", "lead": "In deze workshop vragen we mensen die kanker hebben gehad om hun ervaringen en mening te delen over barrières om fysiek actief te zijn en mogelijke manieren om met deze barrières om te gaan.<br><br>We focussen ons in eerste instantie op mensen die borstkanker, prostaatkanker of darmkanker hebben gehad en die hun primaire behandeling hebben afgerond.<br><br>Vul je gegevens in:", "fields": [{"id": "diagnose", "label": "Welke kankerdiagnose heb je gehad?", "required": true, "options": ["Borstkanker", "Prostaatkanker", "Darmkanker (colorectaal)", "Andere"], "allow_other": true, "hint": "Was het een combinatie of iets anders? Vul dat gerust aan in het tekstvak.", "other_placeholder": "Andere diagnose, of verduidelijking bij je keuze"}, {"id": "behandeling", "label": "Welke behandeling(en) heb je gekregen?", "required": true, "options": ["Operatie", "Chemotherapie", "Bestraling", "Hormoontherapie", "Een combinatie hiervan", "Andere"], "allow_other": true, "hint": "Kies wat het best past en verduidelijk gerust in het tekstvak.", "other_placeholder": "Andere behandeling, of verduidelijking bij je keuze"}, {"id": "tijd_sinds", "label": "Hoe lang is het geleden dat je primaire behandeling afgerond was?", "required": true, "options": ["Minder dan 6 maanden", "6 maanden tot 1 jaar", "1 tot 2 jaar", "2 tot 5 jaar", "Meer dan 5 jaar"]}]}, {"id": "taken", "nav": "Taken", "level": 1, "kind": "group", "title": "De twee taken", "lead": "Deze workshop bestaat uit twee taken. Je mag ze in elke volgorde doen en tussendoor pauzeren.", "html": "<p>In beide taken geef je telkens je mening met één klik, en kan je daaronder in je eigen woorden uitleggen waarom. Dat uitleggen is optioneel, maar juist die uitleg helpt ons het meest. Onderaan elke taak vragen we ook wat er volgens jou ontbreekt.</p><p>Wil je eerst zien wat er allemaal in onze lijst zit? Onderdeel 4, <b>De kaart</b>, toont alle drempels en oplossingen in een overzicht.</p>"}, {"id": "taak_drempels", "nav": "Barrières", "level": 2, "kind": "barriers", "dataset": "experiential", "title": "Validatie van kankerspecifieke oranje vlaggen en barrières", "summary": "Beoordeel hoe relevant de voorgestelde barrières zijn.", "lead": "We beoordelen voorgestelde kankerspecifieke oranje vlaggen en barrières voor fysieke activiteit.", "html": "<div class=\"note\"><b>Definitie</b><br>🟠 <b>Oranje vlag of barrière:</b> een persoons- en activiteitsspecifieke factor die ervoor kan zorgen dat een bepaalde fysieke activiteit moeilijker wordt om uit te voeren en waarvoor mogelijk zelfmanagement, een copingstrategie of een aanpassing van de activiteit nodig is.</div>", "question": "In hoeverre vind je deze barrière relevant voor mensen die kanker hebben gehad en fysiek actief willen zijn?", "choices": {"ja": "Relevant", "misschien": "Soms relevant", "nee": "Niet relevant"}, "extra_open_title": "Slotvragen", "extra_open": [{"id": "missing_barriers", "label": "Vind je dat er belangrijke barrières ontbreken voor mensen die borstkanker, prostaatkanker of colorectale kanker hebben gehad in de context van fysieke activiteit? Zo ja, welke?", "placeholder": "Bijvoorbeeld: ik durfde niet meer, ik was bang om iets te forceren, ik schaamde me om te gaan sporten..."}, {"id": "priority_barriers", "label": "Prioritering (optioneel): welke 3 barrières vind je het meest cruciaal om in een app zoals KanFit te tonen?", "placeholder": "1. ... 2. ... 3. ..."}]}, {"id": "taak_coping", "nav": "Copingstrategieën", "level": 2, "kind": "adjudicate", "dataset": "barrier_coping", "scenario_labels": {"barrier": "Barrière", "coping": "Copingstrategie"}, "title": "Validatie van de koppeling tussen barrières en copingstrategieën", "summary": "Beoordeel of de voorgestelde copingstrategie zou helpen.", "lead": "Wanneer een bepaalde barrière het moeilijker maakt om fysiek actief te zijn, kan een copingstrategie helpen.", "html": "<div class=\"note\"><b>Definitie</b><br>🟢 <b>Copingstrategie:</b> een concrete strategie om met een bepaalde barrière om te gaan, zodat je een fysieke activiteit toch kunt uitvoeren of gemakkelijker kunt volhouden. Een copingstrategie kan bijvoorbeeld bestaan uit het aanpassen van de activiteit, het tempo of de duur, het inbouwen van rustmomenten of het kiezen van een andere manier om te bewegen.</div>", "question": "In hoeverre denk je dat deze copingstrategie zou helpen om met deze barrière om te gaan?", "choices": {"ja": "Akkoord", "misschien": "Misschien", "nee": "Niet akkoord"}, "extra_open_title": "Slotvrage   kankeroverlevers/) en herbouw met `make workshop`. Je hoeft deze template
  niet aan te raken.
-->
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KanFit - Workshop voor kankeroverlevers</title>
<style>
  :root{
    --bg:#f5f7f8; --panel:#fff; --ink:#182029; --muted:#5b6673; --line:#e3e8ec;
    --brand:#1f6f6b; --brand-ink:#0e4f4b; --brand-soft:#e6f1f0;
    --red:#c0392b; --orange:#d98324; --yellow:#c9a227; --green:#2e8b57;
    /* Semantic colour coding: barrier = obstacle (amber), coping = solution (green), activity = brand. */
    --barrier:#c47f2a; --barrier-soft:#faf1e2; --barrier-ink:#8a5713;
    --coping:#2e8b57; --coping-soft:#e6f3ec; --coping-ink:#1e6b41;
    --activity:#1f6f6b; --activity-soft:#e6f1f0;
    --shadow:0 1px 3px rgba(20,30,45,.07),0 8px 22px rgba(20,30,45,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--ink);line-height:1.55}
  header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
         display:flex;align-items:center;gap:16px;padding:11px 22px;box-shadow:var(--shadow)}
  header h1{font-size:15px;margin:0;font-weight:700}
  header .sub{font-size:11.5px;color:var(--muted)}
  .spacer{flex:1}
  .progress{display:flex;align-items:center;gap:9px;white-space:nowrap}
  .progress .bar{width:120px;height:8px;border-radius:999px;background:#e3e8ec;overflow:hidden}
  .progress .fill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--brand),var(--green));
                  transition:width .35s ease}
  .progress .txt{font-size:12px;color:var(--brand-ink);font-weight:700}
  .btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;
       padding:8px 14px;font-size:13px;cursor:pointer;font-weight:600}
  .btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
  .btn:hover{filter:brightness(.97)}
  .cancerbar{position:sticky;top:56px;z-index:19;background:#0e4f4b;color:#fff;display:flex;
             align-items:center;gap:8px;padding:8px 22px;flex-wrap:wrap}
  .cancerbar.hidden{display:none}
  .cancerbar .cb-label{font-size:12px;opacity:.85;margin-right:4px;font-weight:600}
  .cb{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:999px;
      padding:5px 14px;font-size:12.5px;font-weight:700;cursor:pointer}
  .cb:hover{background:rgba(255,255,255,.12)}
  .cb.sel{background:#fff;color:#0e4f4b;border-color:#fff}
  .cb-hint{font-size:11.5px;opacity:.8;margin-left:auto}
  .layout{display:grid;grid-template-columns:250px 1fr;max-width:1200px;margin:0 auto}
  nav{position:sticky;top:95px;align-self:start;height:calc(100vh - 95px);overflow:auto;padding:16px 16px 16px 12px;
      border-right:2px solid var(--brand);background:rgba(255,255,255,.42)}
  nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;
        border-radius:8px;color:var(--muted);text-decoration:none;font-size:13px;font-weight:600}
  nav a:hover{background:#eceff1;color:var(--ink)}
  nav a.active{background:var(--brand);color:#fff}
  nav a .no{flex:0 0 auto;font-variant-numeric:tabular-nums;opacity:.75}
  nav a .lbl{flex:1;min-width:0}
  /* Task subsections (3.1 ... 3.4) are indented under their parent and set slightly smaller. */
  nav a.lvl2{margin-left:14px;padding:7px 11px;font-size:12.5px;font-weight:600;
             border-left:2px solid var(--line);border-radius:0 8px 8px 0}
  nav a.lvl2.active{border-left-color:var(--brand)}
  nav a.done-mark::after{content:'\2713';color:var(--green);font-weight:800;font-size:12px}
  nav a.active.done-mark::after{color:#fff}
  nav .badge{font-size:10px;background:#eceff1;color:var(--muted);border-radius:999px;padding:1px 7px}
  nav a.active .badge{background:rgba(255,255,255,.25);color:#fff}
  .taskno{display:inline-block;font-size:12px;font-weight:800;color:var(--brand-ink);
          background:var(--brand-soft);border-radius:7px;padding:2px 9px;margin-bottom:6px;
          letter-spacing:.02em}
  /* Task overview (the "Taken" landing card list) */
  .tasklist{display:grid;gap:11px;margin:6px 0 4px}
  .taskcard{display:flex;gap:13px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);
            border-radius:12px;padding:14px 17px;box-shadow:var(--shadow);cursor:pointer;text-align:left;
            font:inherit;width:100%}
  .taskcard:hover{border-color:var(--brand);transform:translateY(-1px)}
  .taskcard .tn{flex:0 0 auto;width:30px;height:30px;border-radius:9px;background:var(--brand);color:#fff;
                font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
  .taskcard h4{margin:1px 0 3px;font-size:14.5px}
  .taskcard p{margin:0;font-size:12.8px;color:var(--muted)}
  .taskcard .tmeta{font-size:11.5px;color:var(--brand-ink);font-weight:700;margin-top:5px}
  /* Background / demographic form */
  .bg-field{margin:0 0 15px;max-width:640px}
  .bg-field label{display:block;font-weight:600;font-size:13.5px;margin-bottom:5px}
  .bg-field .hint{font-weight:400;color:var(--muted);font-size:12.5px;display:block;margin-top:1px}
  .bg-opts{display:flex;gap:7px;flex-wrap:wrap}
  .bg-opt{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 13px;font-size:13px;
          cursor:pointer;font-weight:600;user-select:none}
  .bg-opt.sel{background:var(--brand);color:#fff;border-color:var(--brand)}
  .bg-field input[type=text]{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;
                             font:inherit;font-size:13px}
  .req{color:var(--red);font-weight:800}
  .export-box{margin:16px 0 0;padding:17px 20px;border:1px solid var(--line);border-left:5px solid var(--brand);
              border-radius:12px;background:var(--panel);box-shadow:var(--shadow);max-width:74ch}
  .export-box h3{margin:0 0 8px;font-size:15.5px}
  .export-steps{margin:0 0 14px;padding-left:20px;color:var(--muted);font-size:13.5px}
  .export-steps li{margin:0 0 5px}
  .export-steps b{color:var(--ink)}
  .export-btn{font-size:14px;padding:10px 18px}
  .export-note{margin:12px 0 0;font-size:12.5px;color:var(--muted)}
  .extra-open{margin:22px 0 0;padding:16px 18px;border:1px dashed var(--line);border-radius:12px;
              background:#fbfcfc}
  .extra-open h3{margin:0 0 10px;font-size:14.5px}
  .secnav{display:flex;justify-content:space-between;gap:12px;margin:26px 0 0;padding-top:16px;
          border-top:1px solid var(--line)}
  .secnav button{max-width:47%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  main{padding:26px 32px 140px}
  section{display:none;animation:fade .2s ease}
  section.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  h2{font-size:22px;margin:0 0 4px}
  .lead{color:var(--muted);max-width:74ch;margin:0 0 18px}
  .prose{max-width:74ch}
  .prose h3{margin:18px 0 4px;font-size:15.5px}
  .prose p{color:var(--muted);margin:0 0 12px}
  .prose ul{color:var(--muted);margin:0 0 12px;padding-left:20px}
  .prose b{color:var(--ink)}
  .hero{display:block;width:100%;max-width:720px;height:auto;border-radius:12px;border:1px solid var(--line);
        box-shadow:var(--shadow);margin:4px 0 16px}
  .hero-cap{font-size:11.5px;color:var(--muted);margin:-10px 0 16px;max-width:720px}
  /* Flag and barrier lists are authored as one general block plus a block per tumour type. */
  .grp{margin:22px 0 12px;padding:0 0 2px;border-bottom:1px solid var(--line);max-width:74ch}
  .grp:first-child{margin-top:0}
  .grp h3{margin:0 0 3px;font-size:16px;color:var(--brand-ink)}
  .grp p{margin:0 0 8px;font-size:13px;color:var(--muted)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 18px;
        margin:0 0 13px;box-shadow:var(--shadow)}
  .card h3{margin:0 0 6px;font-size:15.5px}
  .meta{font-size:12px;color:var(--muted);margin:3px 0 9px}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid var(--line);margin-right:6px;vertical-align:middle}
  .lvltag-red{background:var(--red);color:#fff;border-color:var(--red)}
  .lvltag-orange{background:var(--orange);color:#fff;border-color:var(--orange)}
  .lvltag-yellow{background:var(--yellow);color:#fff;border-color:var(--yellow)}
  .lvltag-green{background:var(--green);color:#fff;border-color:var(--green)}
  .ctag{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:999px;
        background:#eef1f3;color:var(--muted);margin-left:5px;vertical-align:middle;text-transform:capitalize}
  .flag-red{border-left:6px solid var(--red)} .flag-orange{border-left:6px solid var(--orange)}
  .flag-yellow{border-left:6px solid var(--yellow)} .flag-green{border-left:6px solid var(--green)}
  .lvl-red{color:var(--red)} .lvl-orange{color:var(--orange)} .lvl-yellow{color:#a8871f} .lvl-green{color:var(--green)}
  .adj-scenario{margin:2px 0 2px}
  .adj-line{display:flex;gap:9px;align-items:baseline;margin:5px 0;font-size:15px;line-height:1.4}
  .adj-key{flex:0 0 auto;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;
           padding:3px 9px;border-radius:999px;position:relative;top:-1px}
  .k-barrier{background:var(--barrier-soft);color:var(--barrier-ink);border:1px solid #eBD9bd}
  .k-coping{background:var(--coping-soft);color:var(--coping-ink);border:1px solid #c7e4d3}
  .k-activity{background:var(--activity-soft);color:var(--brand-ink);border:1px solid #cfe4e2}
  .k-person{background:#eef1f3;color:var(--muted);border:1px solid var(--line)}
  .v-barrier{color:var(--barrier-ink);font-weight:600}
  .v-coping{color:var(--coping-ink);font-weight:600}
  .v-activity{color:var(--brand-ink);font-weight:600}
  .adj-q{font-size:12.5px;color:var(--muted);margin:10px 0 2px;border-top:1px dashed var(--line);padding-top:9px}
  /* ---- interactive concept-map navigator ---- */
  .nav-block{border:1px solid var(--line);border-radius:14px;background:var(--panel);box-shadow:var(--shadow);
             overflow:hidden;margin:0 0 14px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
             -webkit-tap-highlight-color:transparent}
  .nav-head{display:flex;align-items:center;gap:8px 12px;padding:11px 14px;flex-wrap:wrap;border-bottom:1px solid var(--line);
            background:linear-gradient(180deg,#fff,#fbfcfc)}
  .nav-tabs{display:flex;gap:6px;flex-wrap:wrap}
  .nav-tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:12.5px;
           font-weight:700;cursor:pointer;color:var(--muted);transition:background .18s,color .18s,border-color .18s,transform .18s}
  .nav-tab:hover{transform:translateY(-1px);border-color:#aebbc1}
  /* Selected tab: brand by default, overridden for the two semantically coloured taxonomies. */
  .nav-tab.sel{color:#fff;background:var(--brand);border-color:var(--brand)}
  .nav-tab.sel.t-barrier{background:var(--barrier);border-color:var(--barrier)}
  .nav-tab.sel.t-coping{background:var(--coping);border-color:var(--coping)}
  .nav-layouts{display:flex;margin-left:auto;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .nav-layouts button{border:0;border-left:1px solid var(--line);background:#fff;padding:6px 11px;font-size:12px;
                      font-weight:700;color:var(--muted);cursor:pointer}
  .nav-layouts button:first-child{border-left:0}
  .nav-layouts button.sel{background:var(--ink);color:#fff}
  .nav-expand{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;font-size:12px;
              font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap}
  .nav-expand:hover{background:#f1f4f5;color:var(--ink)}
  .nav-canvas{position:relative;height:clamp(460px,68vh,680px);cursor:grab;touch-action:none;overflow:hidden;
              background:radial-gradient(circle at 1px 1px,#e7ebee 1px,transparent 0) 0 0/22px 22px,var(--panel)}
  .nav-canvas.grabbing{cursor:grabbing}
  .nav-svg{position:absolute;inset:0}
  .nav-canvas svg{width:100%;height:100%;display:block}
  .nav-canvas .vp{will-change:transform}
  .nav-hint{position:absolute;left:12px;bottom:11px;font-size:11px;color:var(--muted);
            background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:8px;padding:5px 10px;
            pointer-events:none;max-width:64%;transition:opacity .5s ease}
  .nav-hint.hid{opacity:0}
  .nav-tooltip{position:absolute;left:0;top:0;z-index:4;display:none;max-width:min(340px,calc(100% - 28px));padding:10px 12px;
               border:1px solid #b9ddd0;border-radius:10px;background:rgba(255,255,255,.97);color:var(--ink);
               box-shadow:0 8px 24px rgba(25,49,57,.18);font-size:12px;line-height:1.45;pointer-events:none}
  .nav-tooltip.show{display:block}.nav-tooltip b{display:block;margin-bottom:3px;color:#16865b;font-size:12.5px}
  .nav-ctrls{position:absolute;right:11px;top:11px;display:flex;gap:5px;padding:4px;border:1px solid var(--line);
              border-radius:11px;background:rgba(255,255,255,.9);box-shadow:var(--shadow);backdrop-filter:blur(5px)}
  .nav-ctrls button{width:32px;height:32px;border:0;background:#fff;border-radius:7px;
                    cursor:pointer;font-weight:800;font-size:15px;color:var(--ink);line-height:1;box-shadow:var(--shadow)}
  .nav-ctrls button:hover{background:#f1f4f5}
  .nv-link{fill:none;stroke:var(--branch,#b9c5ca);stroke-width:1.55;stroke-linecap:round;opacity:.5}
  .nv-link.hot{stroke:#2f7f7a;stroke-width:3.2;opacity:1;filter:drop-shadow(0 0 2px rgba(47,127,122,.38))}
  .nv-node{cursor:grab;filter:drop-shadow(0 1px 1px rgba(25,49,57,.08))}
  .nv-node:active{cursor:grabbing}
  .nv-node rect{transition:stroke-width .18s,filter .18s}
  .nv-node:hover rect{stroke-width:2.3;filter:brightness(.985)}
  .nv-node text{font-size:12px;dominant-baseline:central;pointer-events:none;user-select:none}
  .nv-badge-txt{font-size:12px;font-weight:800;fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none}
  .sel-path{fill:none;stroke:#76aaa6;stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round;opacity:.82;
            stroke-dasharray:10 8;filter:drop-shadow(0 0 2px rgba(47,127,122,.32));animation:navPathPulse .72s linear infinite}
  .nv-runner{fill:#2f7f7a;stroke:#fff;stroke-width:1.5;filter:drop-shadow(0 1px 2px rgba(25,78,75,.4))}
  .nv-node.sel rect{stroke:#2f7f7a!important;filter:drop-shadow(0 0 3px rgba(47,127,122,.38))}
  @keyframes navPathPulse{to{stroke-dashoffset:-18}}
  @media(max-width:760px){
    .nav-layouts{order:3;margin-left:0;width:100%}.nav-layouts button{flex:1;padding:8px 5px}
    .nav-expand{margin-left:auto}.nav-canvas{height:clamp(440px,65vh,580px)}
    .nav-hint{max-width:calc(100% - 92px)}
  }
  .choices{display:flex;gap:8px;margin:10px 0 8px;flex-wrap:wrap}
  .choice{border:1px solid var(--line);border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer;font-weight:600;user-select:none;background:#fff}
  .choice.ja.sel{background:var(--green);color:#fff;border-color:var(--green)}
  .choice.misschien.sel{background:var(--yellow);color:#fff;border-color:var(--yellow)}
  .choice.nee.sel{background:var(--red);color:#fff;border-color:var(--red)}
  textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:13px;resize:vertical;min-height:36px;margin-top:4px}
  .src{font-size:11px;color:var(--muted);margin-top:8px}
  .kpi{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0}
  .kpi div{background:var(--brand-soft);border-radius:10px;padding:10px 16px;font-size:12.5px;color:var(--brand-ink)}
  .kpi b{display:block;font-size:20px}
  .note{background:#fff8e6;border:1px solid #f0e0b0;border-radius:10px;padding:12px 15px;font-size:13px;margin:14px 0}
  .open-field{margin:0 0 14px}
  .open-field label{display:block;font-weight:600;font-size:13.5px;margin-bottom:4px}
  .schema{display:flex;flex-direction:column;align-items:stretch;gap:4px;max-width:640px;margin:14px 0}
  .sbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 15px;font-weight:700;box-shadow:var(--shadow)}
  .sbox span{display:block;font-weight:400;color:var(--muted);font-size:12.5px;margin-top:3px}
  .sbox-l1{border-left:5px solid var(--red)} .sbox-l2{border-left:5px solid var(--brand)}
  .sarrow{text-align:center;color:var(--muted);font-size:12px}
  @media (max-width: 720px){
    header{position:static;align-items:flex-start;flex-wrap:wrap;padding:10px 14px}
    header .spacer{display:none}
    header h1{font-size:14px;line-height:1.3}
    header .sub{font-size:11px}
    .progress, header .btn{order:2}
    .cancerbar{position:static;padding:8px 14px}
    .cb-hint{display:none}
    .layout{display:block;max-width:none}
    nav{position:static;height:auto;padding:8px;display:flex;gap:4px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);background:var(--bg)}
    nav a{flex:0 0 auto}
    /* In the horizontal strip the indent has no meaning; the 3.1-style number carries it instead. */
    nav a.lvl2{margin-left:0;border-left:0;border-radius:8px}
    .secnav button{max-width:46%}
    main{padding:18px 14px 100px}
  }
</style>
</head>
<body>
<header>
  <div>
    <h1 id="h-title"></h1>
    <div class="sub" id="h-sub"></div>
  </div>
  <div class="spacer"></div>
  <div class="progress" title="Voortgang">
    <div class="bar"><div class="fill" id="progress-fill"></div></div>
    <span class="txt" id="progress-text">0 / 0</span>
  </div>
  <button class="btn" onclick="resetAll()">Wissen</button>
  <button class="btn primary" onclick="exportJSON()">Antwoorden exporteren</button>
</header>

<div class="cancerbar hidden" id="cancerbar">
  <span class="cb-label">Bekijk per kanker:</span>
  <button class="cb sel" data-c="all" onclick="setCancer('all',this)">Alle</button>
  <button class="cb" data-c="breast" onclick="setCancer('breast',this)">Borstkanker</button>
  <button class="cb" data-c="prostate" onclick="setCancer('prostate',this)">Prostaatkanker</button>
  <button class="cb" data-c="colorectal" onclick="setCancer('colorectal',this)">Colorectale kanker</button>
  <span class="cb-hint" id="cb-hint"></span>
</div>

<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>

kOTsjBuGq0y9DwkJzYz2hz6/wqZCBcTXc9Py9Z/9k=\" alt=\"KanFit, een digitale interventie voor een actieve levensstijl na kanker\"><p>Bedankt om deel te nemen aan deze online workshop.</p><p>Deze workshop maakt deel uit van het KanFit-project (<a href=\"https://www.crig.ugent.be/en/emma-tack\" target=\"_blank\" rel=\"noopener\">www.crig.ugent.be/en/emma-tack</a>). Met dit project willen we een digitale interventie ontwikkelen, genaamd <b>KanFit</b>, die mensen ondersteunt in het aannemen van een actieve levensstijl na kanker. Dit onderzoek is mogelijk dankzij Kom op tegen Kanker (KOTK) en het Fonds Wetenschappelijk Onderzoek (FWO).</p><p>Jouw ervaring als persoon die kanker heeft gehad, is belangrijk om ervoor te zorgen dat KanFit goed aansluit bij de dagelijkse realiteit van mensen na kanker.</p><h3>Huidige workshop</h3><p>De workshop richt zich op het identificeren en valideren van kankerspecifieke barrières voor fysieke activiteit en mogelijke strategieën om met deze barrières om te gaan.</p><p>We zijn benieuwd naar jouw persoonlijke ervaring en mening. Het gaat dus niet om wat volgens jou medisch gezien juist of fout is, maar om wat jij herkent, relevant vindt en denkt dat in de praktijk zou kunnen helpen.</p><p>Je doorloopt de workshop op eigen tempo. Je kunt pauzeren en de workshop op een later moment hervatten. De geschatte tijd van de workshop is ongeveer 1 uur.</p>"}, {"id": "achtergrond", "nav": "Over jou", "level": 1, "kind": "background", "title": "Ex-kankerpatiënten", "lead": "In deze workshop vragen we mensen die kanker hebben gehad om hun ervaringen en mening te delen over barrières om fysiek actief te zijn en mogelijke manieren om met deze barrières om te gaan.<br><br>We focussen ons in eerste instantie op mensen die borstkanker, prostaatkanker of darmkanker hebben gehad en die hun primaire behandeling hebben afgerond.<br><br>Vul je gegevens in:", "fields": [{"id": "diagnose", "label": "Welke kankerdiagnose heb je gehad?", "required": true, "options": ["Borstkanker", "Prostaatkanker", "Darmkanker (colorectaal)", "Andere"], "allow_other": true, "hint": "Was het een combinatie of iets anders? Vul dat gerust aan in het tekstvak.", "other_placeholder": "Andere diagnose, of verduidelijking bij je keuze"}, {"id": "behandeling", "label": "Welke behandeling(en) heb je gekregen?", "required": true, "options": ["Operatie", "Chemotherapie", "Bestraling", "Hormoontherapie", "Een combinatie hiervan", "Andere"], "allow_other": true, "hint": "Kies wat het best past en verduidelijk gerust in het tekstvak.", "other_placeholder": "Andere behandeling, of verduidelijking bij je keuze"}, {"id": "tijd_sinds", "label": "Hoe lang is het geleden dat je primaire behandeling afgerond was?", "required": true, "options": ["Minder dan 6 maanden", "6 maanden tot 1 jaar", "1 tot 2 jaar", "2 tot 5 jaar", "Meer dan 5 jaar"]}]}, {"id": "taken", "nav": "Taken", "level": 1, "kind": "group", "title": "De twee taken", "lead": "Deze workshop bestaat uit twee taken. Je mag ze in elke volgorde doen en tussendoor pauzeren.", "html": "<p>In beide taken geef je telkens je mening met één klik, en kan je daaronder in je eigen woorden uitleggen waarom. Dat uitleggen is optioneel, maar juist die uitleg helpt ons het meest. Onderaan elke taak vragen we ook wat er volgens jou ontbreekt.</p><p>Wil je eerst zien wat er allemaal in onze lijst zit? Onderdeel 4, <b>De kaart</b>, toont alle drempels en oplossingen in een overzicht.</p>"}, {"id": "taak_drempels", "nav": "Barrières", "level": 2, "kind": "barriers", "dataset": "experiential", "title": "Validatie van kankerspecifieke oranje vlaggen en barrières", "summary": "Beoordeel hoe relevant de voorgestelde barrières zijn.", "lead": "We beoordelen voorgestelde kankerspecifieke oranje vlaggen en barrières voor fysieke activiteit.", "html": "<div class=\"note\"><b>Definitie</b><br>🟠 <b>Oranje vlag of barrière:</b> een persoons- en activiteitsspecifieke factor die ervoor kan zorgen dat een bepaalde fysieke activiteit moeilijker wordt om uit te voeren en waarvoor mogelijk zelfmanagement, een copingstrategie of een aanpassing van de activiteit nodig is.</div>", "question": "In hoeverre vind je deze barrière relevant voor mensen die kanker hebben gehad en fysiek actief willen zijn?", "choices": {"ja": "Relevant", "misschien": "Soms relevant", "nee": "Niet relevant"}, "extra_open_title": "Slotvragen", "extra_open": [{"id": "missing_barriers", "label": "Vind je dat er belangrijke barrières ontbreken voor mensen die borstkanker, prostaatkanker of colorectale kanker hebben gehad in de context van fysieke activiteit? Zo ja, welke?", "placeholder": "Bijvoorbeeld: ik durfde niet meer, ik was bang om iets te forceren, ik schaamde me om te gaan sporten..."}, {"id": "priority_barriers", "label": "Prioritering (optioneel): welke 3 barrières vind je het meest cruciaal om in een app zoals KanFit te tonen?", "placeholder": "1. ... 2. ... 3. ..."}]}, {"id": "taak_coping", "nav": "Copingstrategieën", "level": 2, "kind": "adjudicate", "dataset": "barrier_coping", "scenario_labels": {"barrier": "Barrière", "coping": "Copingstrategie"}, "title": "Validatie van de koppeling tussen barrières en copingstrategieën", "summary": "Beoordeel of de voorgestelde copingstrategie zou helpen.", "lead": "Wanneer een bepaalde barrière het moeilijker maakt om fysiek actief te zijn, kan een copingstrategie helpen.", "html": "<div class=\"note\"><b>Definitie</b><br>🟢 <b>Copingstrategie:</b> een concrete strategie om met een bepaalde barrière om te gaan, zodat je een fysieke activiteit toch kunt uitvoeren of gemakkelijker kunt volhouden. Een copingstrategie kan bijvoorbeeld bestaan uit het aanpassen van de activiteit, het tempo of de duur, het inbouwen van rustmomenten of het kiezen van een andere manier om te bewegen.</div>", "question": "In hoeverre denk je dat deze copingstrategie zou helpen om met deze barrière om te gaan?", "choices": {"ja": "Akkoord", "misschien": "Misschien", "nee": "Niet akkoord"}, "extra_open_title" nt.be\">emma.tack@ugent.be</a>. Zolang je dat niet doet, ontvangen wij niets.", "note": "Het bestand bevat je antwoorden en je uitleg, samen met de drie vragen over je situatie. Je naam staat er niet in. Het onderzoeksteam bewaart de bestanden gecodeerd en verwerkt ze vertrouwelijk, conform de GDPR en het gegevensbeschermingsbeleid van de UGent. Bedankt om je ervaring te delen.", "export_title": "Je antwoorden opslaan en doorsturen", "export_steps": ["Klik op de knop hieronder. Je krijgt dan één bestand (<b>kanfit_workshop_cs_&lt;datum&gt;.json</b>), meestal in je map Downloads.", "Stuur dat bestand als bijlage naar <b>emma.tack@ugent.be</b>. Een leeg mailtje volstaat.", "Klaar. Je mag deze pagina daarna sluiten; je antwoorden blijven bewaard op dit toestel."]}]};

const CANCER_NL = {all:"alle kankersoorten", breast:"borstkanker", prostate:"prostaatkanker", colorectal:"colorectale kanker"};

// ---- helpers ---------------------------------------------------------------
function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function cancerNL(c){ return (DATA.cancer_labels&&DATA.cancer_labels[c])||CANCER_NL[c]||c; }
function cancerTags(list){ return (list||[]).map(c=>`<span class="ctag">${cancerNL(c)}</span>`).join(''); }
function flagMatches(f){ return ACTIVE_CANCER==='all' || !f.cancers || f.cancers.length===0 || f.cancers.includes(ACTIVE_CANCER); }

// Flat index of every adjudication item, keyed by id (for the enriched export).
const ADJ_INDEX = {};
Object.entries(DATA.adjudication||{}).forEach(([dataset, items])=>{
  (items||[]).forEach(it=>{ ADJ_INDEX[it.id] = Object.assign({dataset}, it); });
});

// ---- answer storage --------------------------------------------------------
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(answers)); updateProgress(); }
function setAnswer(id, field, val){ answers[id]=answers[id]||{}; answers[id][field]=val; save(); }
function pick(id,val,el){ setAnswer(id,'choice',val);
  el.parentElement.querySelectorAll('.choice').forEach(c=>c.classList.remove('sel')); el.classList.add('sel'); }
function choiceRow(id, opts){
  const a=answers[id]||{};
  const L = opts || {ja:'Ja', misschien:'Misschien', nee:'Nee'};
  const mk=(v,l)=>`<span class="choice ${v} ${a.choice===v?'sel':''}" onclick="pick('${id}','${v}',this)">${l}</span>`;
  return `<div class="choices">${mk('ja',L.ja)}${mk('misschien',L.misschien)}${mk('nee',L.nee)}</div>
    <textarea placeholder="Commentaar / ontbreekt er iets?" oninput="setAnswer('${id}','comment',this.value)">${esc(a.comment||'')}</textarea>`;
}

// ---- section renderers -----------------------------------------------------
function renderProse(sec){ return `<div class="prose">${sec.html||''}</div>`; }

// Each flag task owns one level: red in the "rode vlaggen" task, orange in "oranje vlaggen".
const LVL_NL={red:'ROOD',orange:'ORANJE',yellow:'GEEL',green:'GROEN'};
function secLevels(sec){ return sec.levels || ['red','orange']; }
function flagsFor(sec){
  const want=new Set(secLevels(sec));
  return (DATA.flags||[]).filter(f=>want.has(f.level));
}

// Flag and barrier lists are authored as one general block followed by a block per tumour type.
// `sec.groups` supplies the heading and the intro of each block; a block without items is skipped
// rather than left standing as an empty heading, and anything the content file does not name still
// gets rendered (so a new group in the knowledge base can never silently disappear from the page).
function renderGroups(sec, items, card){
  const groups=sec.groups||[];
  if(!groups.length) return items.map(card).join('');
  const shown=new Set(); let out='';
  groups.forEach(g=>{
    const mine=items.filter(it=>(it.group||'general')===g.id);
    if(!mine.length) return;
    mine.forEach(it=>shown.add(it));
    out += `<div class="grp"><h3>${esc(g.title)}</h3>${g.lead?`<p>${g.lead}</p>`:''}</div>`
         + mine.map(card).join('');
  });
  const rest=items.filter(it=>!shown.has(it));
  return out + rest.map(card).join('');
}

function flagCard(sec, f){
  const opts=sec.choices||{ja:'Relevant', misschien:'Soms relevant', nee:'Niet relevant'};
  return `<div class="card flag-${f.level}"><h3><span class="lvl-${f.level}">&#9679;</span> ${esc(f.label)}
      <span class="tag lvltag-${f.level}">${LVL_NL[f.level]}</span>${cancerTags(f.cancers)}</h3>
      <div class="meta">${esc(f.description)}</div>
      ${sec.question?`<div class="adj-q">${sec.question}</div>`:''}
      ${choiceRow('flag:'+f.id, opts)}
      <div class="src">Bron: ${esc((f.sources||[]).join('; '))||'-'}</div></div>`;
}
function renderFlags(sec){
  const rated=flagsFor(sec).filter(flagMatches);
  if(!rated.length) return '<div class="card">Geen vlaggen in deze selectie.</div>';
  const hint = (ACTIVE_CANCER!=='all')
    ? `<div class="meta" style="margin-bottom:8px">Getoond: vlaggen die specifiek voor <b>${CANCER_NL[ACTIVE_CANCER]}</b> gelden plus de algemene vlaggen (${rated.length}).</div>` : '';
  return hint + renderGroups(sec, rated, f=>flagCard(sec,f));
}

// A standalone list of proposed barriers (orange flags) rated for relevance.
function barriersFor(sec){ return (DATA.barriers&&DATA.barriers[sec.dataset])||[]; }
function barrierCard(sec, b){
  const opts=sec.choices||{ja:'Relevant', misschien:'Soms relevant', nee:'Niet relevant'};
  return `<div class="card" style="border-left:6px solid var(--barrier)">
      <h3><span class="v-barrier">${esc(b.label)}</span>${b.domain?`<span class="ctag">${esc(b.domain)}</span>`:''}${cancerTags(b.cancers)}</h3>
      ${b.description?`<div class="meta">${esc(b.description)}</div>`:''}
      <div class="adj-q">${sec.question||'Is dit een relevante drempel?'}</div>
      ${choiceRow('bar:'+b.id, opts)}</div>`;
}
function renderBarriers(sec){
  const list=barriersFor(sec);
  if(!list.length) return '<div class="card">Geen drempels in deze lijst.</div>';
  return renderGroups(sec, list, b=>barrierCard(sec,b));
}

// Background / demographic questions (one screen, no scoring; required by the study protocol).
function bgPick(id,val,el){ setAnswer('bg:'+id,'value',val);
  el.parentElement.querySelectorAll('.bg-opt').forEach(c=>c.classList.remove('sel')); el.classList.add('sel'); }
function renderBackground(sec){
  return (sec.fields||[]).map(f=>{
    const a=answers['bg:'+f.id]||{};
    const head=`<label>${f.label}${f.required?' <span class="req">*</span>':''}
      ${f.hint?`<span class="hint">${f.hint}</span>`:''}</label>`;
    if(f.options&&f.options.length){
      const opts=f.options.map(o=>`<span class="bg-opt ${a.value===o?'sel':''}" onclick="bgPick('${f.id}','${esc(o).replace(/'/g,"&#39;")}',this)">${esc(o)}</span>`).join('');
      const other=f.allow_other?`<textarea placeholder="${esc(f.other_placeholder||'Aanvulling of toelichting (optioneel)')}" oninput="setAnswer('bg:${f.id}','comment',this.value)">${esc(a.comment||'')}</textarea>`:'';
      return `<div class="bg-field">${head}<div class="bg-opts">${opts}</div>${other}</div>`;
    }
    return `<div class="bg-field">${head}
      <input type="text" placeholder="${esc(f.placeholder||'')}" value="${esc(a.value||'')}"
             oninput="setAnswer('bg:${f.id}','value',this.value)"></div>`;
  }).join('');
}

// The "Taken" landing page: one card per task, with its number and its item count.
function renderGroup(sec){
  const kids=childTasks(sec);
  const cards=kids.map(k=>{
    const c=sectionCount(k), done=answeredIn(k);
    return `<button class="taskcard" onclick="go('${k.id}')">
      <span class="tn">${secNo(k.id)}</span>
      <span><h4>${esc(k.nav)}</h4><p>${esc(k.summary||k.title||'')}</p>
      ${c!=null?`<span class="tmeta">${done} van ${c} beoordeeld</span>`:'<span class="tmeta">open vraag</span>'}</span>
    </button>`;
  }).join('');
  return `${sec.html?`<div class="prose">${sec.html}</div>`:''}<div class="tasklist">${cards}</div>`;
}

// Blind adjudication: only the clinical scenario and a neutral question are shown.
// The model verdict, probability and framework label are NOT displayed (they live
// in the payload for the later analysis). Discrepancy and control items are
// visually identical on purpose.
function adjItemMatches(it){
  return ACTIVE_CANCER==='all' || !it.group || it.group===ACTIVE_CANCER || it.group==='aandoening';
}
function adjLine(cls,key,val,vcls){
  return `<div class="adj-line"><span class="adj-key ${cls}">${esc(key)}</span><span class="${vcls||''}">${esc(val)}</span></div>`;
}
// The words used for the two halves of a scenario are authored, not fixed: the two workshops name
// the same concepts differently (barrière/drempel, copingstrategie/copingplan) and the research team
// changes that wording in content.json, not here.
const SCENARIO_NL={activity:'Activiteit', barrier:'Drempel', coping:'Copingplan', person:'Persoon'};
function adjScenario(sec, it){
  const L=Object.assign({}, SCENARIO_NL, sec.scenario_labels||{});
  if(sec.dataset==='barrier_coping'){
    return `<div class="adj-scenario">
      ${adjLine('k-barrier',L.barrier,it.barrier,'v-barrier')}
      ${adjLine('k-coping',L.coping,it.coping,'v-coping')}</div>`;
  }
  if(sec.dataset==='activity_barrier'){
    return `<div class="adj-scenario">
      ${adjLine('k-activity',L.activity,it.activity,'v-activity')}
      ${adjLine('k-barrier',L.barrier,it.barrier,'v-barrier')}</div>`;
  }
  return `<div class="adj-scenario">
    ${adjLine('k-activity',L.activity,it.activity,'v-activity')}
    ${adjLine('k-person',L.person,it.person)}</div>`;
}
function renderAdjudicate(sec){
  const items=(DATA.adjudication&&DATA.adjudication[sec.dataset])||[];
  const shown = items.filter(adjItemMatches);
  const q = sec.question || 'Wat is het oordeel?';
  const opts = sec.choices || {ja:'Ja', misschien:'Misschien', nee:'Nee'};
  if(!shown.length) return '<div class="card">Geen items in deze selectie.</div>';
  return shown.map(it=>`
    <div class="card">
      ${adjScenario(sec, it)}
      <div class="adj-q">${q}</div>
      ${choiceRow(it.id, opts)}</div>`).join('');
}

// Labels, hints and questions are authored by the research team in content.json, so light markup
// (<b>, <i>, <span class=...>) is rendered rather than escaped. Anything that comes from the
// knowledge base or from a participant stays escaped.
function renderOpen(sec){
  return (sec.fields||[]).map(f=>{
    const a=answers['open:'+f.id]||{};
    return `<div class="open-field"><label>${f.label}</label>
      <textarea placeholder="${esc(f.placeholder||'Jouw antwoord...')}" oninput="setAnswer('open:${f.id}','comment',this.value)">${esc(a.comment||'')}</textarea></div>`;
  }).join('');
}

function renderDone(sec){
  const fu=(sec.followup||[]).map(f=>{
    const a=answers['fu:'+f.id]||{};
    const opts=(f.options||['Ja','Misschien','Nee']).map(o=>
      `<span class="bg-opt ${a.value===o?'sel':''}" onclick="fuPick('${f.id}','${esc(o)}',this)">${esc(o)}</span>`).join('');
    return `<div class="bg-field"><label>${f.label}</label><div class="bg-opts">${opts}</div>
      <textarea placeholder="${esc(f.placeholder||'Toelichting (optioneel)')}"
        oninput="setAnswer('fu:${f.id}','comment',this.value)">${esc(a.comment||'')}</textarea></div>`;
  }).join('');
  // Two blocks on purpose: first WHAT to do (the yellow note), then the actual doing, with the
  // button and the explanation of what leaves the device in one box so neither is read alone.
  const steps=(sec.export_steps||[]).map(t=>`<li>${t}</li>`).join('');
  return `<div class="kpi" id="kpi"></div>
    ${fu?`<h3 style="margin:18px 0 8px;font-size:15.5px">${sec.followup_title||'Tot slot'}</h3>${fu}`:''}
    ${sec.submit_html?`<div class="note">${sec.submit_html}</div>`:''}
    <div class="export-box">
      <h3>${sec.export_title||'Antwoorden opslaan en bezorgen'}</h3>
      ${steps?`<ol class="export-steps">${steps}</ol>`:''}
      <button class="btn primary export-btn" onclick="exportJSON()">Antwoorden opslaan als bestand (JSON)</button>
      ${sec.note?`<p class="export-note">${sec.note}</p>`:''}
    </div>`;
}
function fuPick(id,val,el){ setAnswer('fu:'+id,'value',val);
  el.parentElement.querySelectorAll('.bg-opt').forEach(c=>c.classList.remove('sel')); el.classList.add('sel'); }

// ---- interactive concept-map navigator ------------------------------------
// A node-link graph of the knowledge base (chips + links) with three switchable
// layouts (left-right, top-down, radial). Click a node to expand/collapse and to
// trace the path back to the top with a moving marker; drag to pan, scroll to
// zoom. Shown by default; mounted lazily via mountNavigators() after each render.
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim() || '#1f6f6b'; }
function renderNavigator(sec){
  const ids=(sec.trees||[]).filter(t=>DATA.trees&&DATA.trees[t]);
  if(!ids.length) return '';
  const tabs=ids.map((t,i)=>{const tr=DATA.trees[t];
    return `<button class="nav-tab t-${tr.kind} ${i===0?'sel':''}" data-tree="${t}" onclick="navTab(this)">${esc(tr.label)}</button>`;}).join('');
  const lay=(id,lbl,sel)=>`<button data-layout="${id}" class="${sel?'sel':''}" onclick="navSetLayout(this)">${lbl}</button>`;
  return `<div class="nav-block" data-first="${ids[0]}" data-mounted="0">
    <div class="nav-head">
      <div class="nav-tabs">${tabs}</div>
      <button class="nav-expand" onclick="navToggleAll(this)" title="Toon alle knopen of ga terug naar de hoofdcategorieën">Alles openvouwen</button>
      <div class="nav-layouts">${lay('lr','Links → rechts',1)}${lay('td','Boven → onder')}${lay('radial','Radiaal')}</div>
    </div>
    <div class="nav-canvas">
      <div class="nav-svg"></div>
      <div class="nav-ctrls">
        <button aria-label="Inzoomen" title="Inzoomen" onclick="navZoom(this,1.18)">+</button>
        <button aria-label="Uitzoomen" title="Uitzoomen" onclick="navZoom(this,0.85)">&minus;</button>
        <button aria-label="Kaart passend maken" title="Kaart passend maken" onclick="navReset(this)">&#8634;</button>
      </div>
      <div class="nav-tooltip" role="tooltip"></div>
      <div class="nav-hint">Sleep de kaart of een knoop &middot; scroll om te zoomen &middot; klik om open of dicht te vouwen &middot; klik een eindpunt voor het pad naar boven</div>
    </div>
  </div>`;
}
function mountNavigators(){
  document.querySelectorAll('.nav-block[data-mounted="0"]').forEach(block=>{
    block.dataset.mounted='1';
    const t=(block.querySelector('.nav-tab.sel')||{}).dataset?.tree || block.dataset.first;
    if(DATA.trees&&DATA.trees[t]) mountTree(block.querySelector('.nav-canvas'), DATA.trees[t]);
  });
}
function navTab(btn){
  const block=btn.closest('.nav-block');
  block.querySelectorAll('.nav-tab').forEach(b=>b.classList.remove('sel')); btn.classList.add('sel');
  mountTree(block.querySelector('.nav-canvas'), DATA.trees[btn.dataset.tree]);
}
function navSetLayout(btn){
  const canvas=btn.closest('.nav-block').querySelector('.nav-canvas'); if(!canvas._state) return;
  btn.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('sel')); btn.classList.add('sel');
  canvas._state.layout=btn.dataset.layout; canvas._state.offsets={}; navRender(canvas); navFit(canvas,true);
}
function navPrimary(st){
  st.expanded=new Set([st.tree.id]);
}
function navUpdateExpand(canvas){
  const b=canvas.closest('.nav-block').querySelector('.nav-expand'); if(!b) return;
  const all=Object.values(canvas._state.byId).filter(n=>n.children&&n.children.length);
  const open=all.length&&all.every(n=>canvas._state.expanded.has(n.id));
  b.textContent=open?'Terug naar hoofdniveau':'Alles openvouwen'; b.dataset.open=open?'1':'0';
}
function navToggleAll(btn){
  const canvas=btn.closest('.nav-block').querySelector('.nav-canvas'), st=canvas._state; if(!st) return;
  if(btn.dataset.open==='1') navPrimary(st);
  else Object.values(st.byId).forEach(n=>{ if(n.children&&n.children.length) st.expanded.add(n.id); });
  st.sel=null; st.offsets={}; navRender(canvas); navFit(canvas,true); navUpdateExpand(canvas);
}
function mountTree(canvas, tree){
  const byId={}, parent={};
  (function walk(n,p){ byId[n.id]=n; parent[n.id]=p; (n.children||[]).forEach(c=>walk(c,n.id)); })(tree,null);
  const th = tree.kind==='barrier'?['--barrier','--barrier-soft']
           : tree.kind==='coping' ?['--coping','--coping-soft']
                                   :['--brand','--brand-soft'];
  const prev=canvas._state||{};
  const st={tree,byId,parent,acc:cssVar(th[0]),soft:cssVar(th[1]),
            expanded:new Set(),sel:null,layout:prev.layout||'lr',tx:24,ty:16,k:1,offsets:{},dragged:false};
  navPrimary(st);
  canvas._state=st;
  if(!canvas._wired){ navWire(canvas); canvas._wired=true; }
  navFit(canvas); navRender(canvas);
  navUpdateExpand(canvas);
}
function navClip(s,mode){ const max=mode==='radial'?20:38; return s.length>max?s.slice(0,max-1)+'…':s; }
function navChipW(label,mode){ const s=navClip(label,mode); return Math.max(54,Math.min(mode==='radial'?164:280,s.length*7.05+30)); }
function navSeg(p,c,mode){
  if(mode==='td'){ const my=(p.y+c.y)/2; return `C ${p.x} ${my} ${c.x} ${my} ${c.x} ${c.y}`; }
  if(mode==='radial'){ const pr=Math.hypot(p.x,p.y),cr=Math.hypot(c.x,c.y); if(pr<1) return `Q ${(c.x*.48).toFixed(1)} ${(c.y*.48).toFixed(1)} ${c.x} ${c.y}`;
    const mid=(pr+cr)/2,pa=Math.atan2(p.y,p.x),ca=Math.atan2(c.y,c.x);
    return `C ${(mid*Math.cos(pa)).toFixed(1)} ${(mid*Math.sin(pa)).toFixed(1)} ${(mid*Math.cos(ca)).toFixed(1)} ${(mid*Math.sin(ca)).toFixed(1)} ${c.x} ${c.y}`; }
  const mx=(p.x+c.x)/2; return `C ${mx} ${p.y} ${mx} ${c.y} ${c.x} ${c.y}`;
}
function navRadialLayout(st,list){
  // Deterministic radial dendrogram. Angular space is partitioned by leaf count, so
  // sibling subtrees never overlap and each top branch owns a clean sector. Rings are
  // evenly spaced by depth and the outer radius scales with how many leaves are open,
  // which keeps it compact when collapsed and balanced (no giant jumps) when expanded.
  const leaf={};
  (function count(n){ const kids=(st.expanded.has(n.id)&&n.children&&n.children.length)?n.children:null;
    if(!kids){ leaf[n.id]=1; return 1; } let s=0; kids.forEach(c=>s+=count(c)); return (leaf[n.id]=s||1); })(st.tree);
  let maxD=1; list.forEach(r=>{ if(r.depth>maxD) maxD=r.depth; });
  const totalLeaves=leaf[st.tree.id]||1;
  const outerR=Math.max(maxD*118, totalLeaves*30/(2*Math.PI));
  const RING=Math.min(340,Math.max(118,outerR/maxD));
  const pos={};
  (function assign(n,a0,a1,depth){
    const ang=(a0+a1)/2, r=depth*RING;
    pos[n.id]={x:r*Math.cos(ang), y:r*Math.sin(ang), n, angle:ang, r};
    const kids=(st.expanded.has(n.id)&&n.children&&n.children.length)?n.children:null;
    if(!kids) return;
    const tot=leaf[n.id]||1, S=a1-a0, gf=depth===0?0.12:0.045, gap=S*gf/kids.length, usable=S-gap*kids.length;
    let a=a0+gap/2;
    kids.forEach(c=>{ const b=a+usable*((leaf[c.id]||1)/tot); assign(c,a,b,depth+1); a=b+gap; });
  })(st.tree, -Math.PI/2, -Math.PI/2+2*Math.PI, 0);
  return pos;
}
function navComputeLayout(canvas){
  const st=canvas._state; const order={}; let leaf=0; const list=[];
  (function walk(n,depth){
    const kids=(st.expanded.has(n.id)&&n.children&&n.children.length)?n.children:null;
    list.push({n,depth});
    if(kids){ kids.forEach(c=>walk(c,depth+1)); order[n.id]=(order[kids[0].id]+order[kids[kids.length-1].id])/2; }
    else { order[n.id]=leaf++; }
  })(st.tree,0);
  const pos={}, levels={}; list.forEach(r=>(levels[r.depth]||(levels[r.depth]=[])).push(r));
  if(st.layout==='lr'){
    const xs=[0]; Object.keys(levels).map(Number).sort((a,b)=>a-b).forEach(d=>{
      if(!d) return; const prev=Math.max(...levels[d-1].map(r=>navChipW(r.n.label)));
      const here=Math.max(...levels[d].map(r=>navChipW(r.n.label))); xs[d]=xs[d-1]+prev/2+here/2+62;
    });
    list.forEach(r=>{ pos[r.n.id]={x:xs[r.depth],y:order[r.n.id]*44,n:r.n}; });
  } else if(st.layout==='td'){
    const leaves=list.filter(r=>!(st.expanded.has(r.n.id)&&r.n.children&&r.n.children.length));
    let cursor=0; leaves.forEach(r=>{ const w=navChipW(r.n.label); order[r.n.id]=cursor+w/2; cursor+=w+28; });
    (function centers(n){ const kids=(st.expanded.has(n.id)&&n.children&&n.children.length)?n.children:null;
      if(kids){ kids.forEach(centers); order[n.id]=(order[kids[0].id]+order[kids[kids.length-1].id])/2; }
    })(st.tree);
    list.forEach(r=>{ pos[r.n.id]={x:order[r.n.id],y:r.depth*92,n:r.n}; });
  } else {
    Object.assign(pos,navRadialLayout(st,list));
  }
  list.forEach(r=>{ const o=st.offsets[r.n.id]; if(o){ pos[r.n.id].x+=o.x; pos[r.n.id].y+=o.y; } });
  return {list,pos};
}
function navRender(canvas){
  const st=canvas._state, {list,pos}=navComputeLayout(canvas), INK=cssVar('--ink'), MUT=cssVar('--muted');
  const chainIds=[]; if(st.sel){ let c=st.sel; while(c!=null){ chainIds.unshift(c); c=st.parent[c]; } }
  const chain=chainIds.map(id=>pos[id]).filter(Boolean), hotEdges=new Set();
  for(let i=1;i<chainIds.length;i++) hotEdges.add(chainIds[i-1]+'\u0000'+chainIds[i]);
  const branchColors=['#6aa8a2','#d09a4f','#788eb8','#9a7db5','#65a777','#bf7280'], topIds=(st.tree.children||[]).map(n=>n.id);
  const branchFor=id=>{ let c=id,p=st.parent[c]; while(p!=null&&p!==st.tree.id){ c=p;p=st.parent[c]; } return p===st.tree.id?c:null; };
  let links='';
  list.forEach(rec=>{ const pid=st.parent[rec.n.id]; if(pid==null||!pos[pid]) return;
    const p=pos[pid], c=pos[rec.n.id], hot=hotEdges.has(pid+'\u0000'+rec.n.id);
    const bi=Math.max(0,topIds.indexOf(branchFor(rec.n.id))), color=branchColors[bi%branchColors.length];
    links+=`<path class="nv-link${hot?' hot':''}" style="--branch:${color}" d="M ${p.x} ${p.y} ${navSeg(p,c,st.layout)}"/>`; });
  const CH=26, radial=st.layout==='radial', SEL='#2f7f7a'; let chips='';
  list.forEach(rec=>{ const n=rec.n, P=pos[n.id]; if(!P) return;
    const kids=n.children&&n.children.length, open=st.expanded.has(n.id), seld=st.sel===n.id;
    if(radial){
      // node = dot, label rotated to read outward along the radius (flipped on the left half)
      const bi=Math.max(0,topIds.indexOf(branchFor(n.id))), bcol=branchColors[bi%branchColors.length];
      const onLeft=Math.cos(P.angle)<0, deg=P.angle*180/Math.PI, labRot=onLeft?deg+180:deg, anchor=onLeft?'end':'start';
      const dotR=kids?6:3.7, off=dotR+5, lx=onLeft?-off:off, tcol=seld?SEL:(kids?INK:MUT), tw=seld?800:(kids?700:520);
      let g=`<g class="nv-node${seld?' sel':''}" data-tid="${n.id}" transform="translate(${P.x.toFixed(1)},${P.y.toFixed(1)})"><title>${esc(n.label)}</title>`;
      if(seld) g+=`<circle r="${dotR+3.5}" fill="none" stroke="${SEL}" stroke-width="1.7" opacity=".85"/>`;
      g+=`<circle r="${dotR}" fill="${kids?st.acc:bcol}" stroke="#fff" stroke-width="1"/>`;
      if(kids) g+=`<text class="nv-badge-txt" x="0" y="0.4" style="font-size:8.5px">${open?'−':'+'}</text>`;
      g+=`<g transform="rotate(${labRot.toFixed(1)})"><text text-anchor="${anchor}" x="${lx}" y="0" fill="${tcol}" style="font-weight:${tw};font-size:11px">${esc(navClip(n.label,'radial'))}</text></g></g>`;
      chips+=g;
    } else {
      const x=P.x, y=P.y, w=navChipW(n.label,st.layout);
      const fill=kids?st.soft:'#ffffff', tcol=seld?st.acc:(kids?INK:MUT), tw=seld?800:(kids?700:500);
      let badge='';
      if(kids){ const bx=x+w/2; badge=`<circle cx="${bx}" cy="${y}" r="8.5" fill="${st.acc}" stroke="#fff" stroke-width="1.2"/>`
          +`<text class="nv-badge-txt" x="${bx}" y="${y+0.5}">${open?'−':'+'}</text>`; }
      chips+=`<g class="nv-node${seld?' sel':''}" data-tid="${n.id}"><title>${esc(n.label)}</title>`
        +`<rect x="${(x-w/2).toFixed(1)}" y="${y-CH/2}" width="${w.toFixed(1)}" height="${CH}" rx="9" fill="${fill}" stroke="${st.acc}" stroke-width="${seld?2.6:1.5}"/>`
        +`<text x="${x.toFixed(1)}" y="${y}" text-anchor="middle" fill="${tcol}" style="font-weight:${tw}">${esc(navClip(n.label,st.layout))}</text>${badge}</g>`;
    } });
  let sp='', runners='';
  if(chain.length>1){ sp='M '+chain[0].x.toFixed(1)+' '+chain[0].y.toFixed(1);
    for(let i=1;i<chain.length;i++){
      const seg=`M ${chain[i-1].x.toFixed(1)} ${chain[i-1].y.toFixed(1)} ${navSeg(chain[i-1],chain[i],st.layout)}`;
      sp+=' '+navSeg(chain[i-1],chain[i],st.layout);
      runners+=`<circle class="nv-runner" r="4.2"><animateMotion dur=".88s" begin="${((i-1)*.1).toFixed(2)}s" repeatCount="indefinite" path="${seg}"/></circle>`;
    } }
  const svg=`<svg xmlns="http://www.w3.org/2000/svg"><g class="vp" transform="translate(${st.tx.toFixed(1)},${st.ty.toFixed(1)}) scale(${st.k.toFixed(3)})">`
    +`<g>${links}</g>${sp?`<path class="sel-path" d="${sp}"/>`:''}<g>${chips}</g>`
    +runners
    +`</g></svg>`;
  canvas.querySelector('.nav-svg').innerHTML=svg;
  st.lastPos=pos;
}
function navFitValues(canvas){
  const st=canvas._state, {pos}=navComputeLayout(canvas), ps=Object.values(pos); if(!ps.length) return;
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  ps.forEach(p=>{
    if(st.layout==='radial'){ const L=navChipW(p.n.label,'radial')+8, a=p.angle||0, ex=p.x+L*Math.cos(a), ey=p.y+L*Math.sin(a);
      minX=Math.min(minX,p.x-8,ex); maxX=Math.max(maxX,p.x+8,ex); minY=Math.min(minY,p.y-8,ey); maxY=Math.max(maxY,p.y+8,ey); }
    else { const hw=navChipW(p.n.label,st.layout)/2+10; minX=Math.min(minX,p.x-hw); maxX=Math.max(maxX,p.x+hw);
           minY=Math.min(minY,p.y-18); maxY=Math.max(maxY,p.y+18); } });
  const W=canvas.clientWidth||700, H=canvas.clientHeight||500, pad=34;
  const k=Math.max(.035, Math.min(1.15, Math.min(W/((maxX-minX)+pad*2), H/((maxY-minY)+pad*2))));
  return {k,tx:W/2-((minX+maxX)/2)*k,ty:H/2-((minY+maxY)/2)*k};
}
function navFit(canvas,smooth){
  const st=canvas._state, target=navFitValues(canvas); if(!target) return;
  if(!smooth){ Object.assign(st,target); return; }
  navAnimateView(canvas,target);
}
function navAnimateView(canvas,target){
  const st=canvas._state, start={tx:st.tx,ty:st.ty,k:st.k}, begun=performance.now(), duration=300;
  if(st.viewFrame) cancelAnimationFrame(st.viewFrame);
  const tick=now=>{ const t=Math.min(1,(now-begun)/duration), e=1-Math.pow(1-t,3);
    st.tx=start.tx+(target.tx-start.tx)*e; st.ty=start.ty+(target.ty-start.ty)*e; st.k=start.k+(target.k-start.k)*e;
    navApply(canvas); if(t<1) st.viewFrame=requestAnimationFrame(tick); else st.viewFrame=null; };
  st.viewFrame=requestAnimationFrame(tick);
}
function navApply(canvas){ const st=canvas._state, vp=canvas.querySelector('.vp');
  if(vp) vp.setAttribute('transform',`translate(${st.tx.toFixed(1)},${st.ty.toFixed(1)}) scale(${st.k.toFixed(3)})`); }
function navRevealBranch(canvas,id){
  const st=canvas._state, n=st.byId[id], ids=new Set([id,...(n.children||[]).map(c=>c.id)]), rects=[];
  canvas.querySelectorAll('.nv-node').forEach(el=>{ if(ids.has(el.getAttribute('data-tid'))) rects.push(el.getBoundingClientRect()); });
  if(!rects.length) return; const cr=canvas.getBoundingClientRect(), pad=30, rightPad=84;
  const left=Math.min(...rects.map(r=>r.left)), right=Math.max(...rects.map(r=>r.right));
  const top=Math.min(...rects.map(r=>r.top)), bottom=Math.max(...rects.map(r=>r.bottom));
  const availW=cr.width-pad-rightPad, availH=cr.height-pad*2;
  if(right-left>availW||bottom-top>availH) return;
  let dx=0,dy=0; if(left<cr.left+pad) dx=cr.left+pad-left; else if(right>cr.right-rightPad) dx=cr.right-rightPad-right;
  if(top<cr.top+pad) dy=cr.top+pad-top; else if(bottom>cr.bottom-pad) dy=cr.bottom-pad-bottom;
  if(Math.abs(dx)>1||Math.abs(dy)>1) navAnimateView(canvas,{tx:st.tx+dx,ty:st.ty+dy,k:st.k});
}
function navOnNode(canvas,id){ const st=canvas._state, n=st.byId[id]; if(!n) return;
  let ancestor=st.parent[id]; while(ancestor!=null){ st.expanded.add(ancestor); ancestor=st.parent[ancestor]; }
  const opening=!!(n.children&&n.children.length&&!st.expanded.has(id));
  if(n.children&&n.children.length){ opening?st.expanded.add(id):st.expanded.delete(id); }
  st.sel=id; navRender(canvas); if(opening) navRevealBranch(canvas,id); navUpdateExpand(canvas); }
function navWire(canvas){
  let gesture=null, moved=false;
  const fadeHint=()=>{ const h=canvas.querySelector('.nav-hint'); if(h) h.classList.add('hid'); };
  const tooltip=canvas.querySelector('.nav-tooltip');
  const hideTip=()=>tooltip&&tooltip.classList.remove('show');
  const moveTip=e=>{ if(!tooltip) return; const el=e.target.closest('[data-tid]'), n=el&&canvas._state.byId[el.getAttribute('data-tid')];
    if(!n||n.children&&n.children.length||!n.description){ hideTip(); return; }
    if(tooltip.dataset.id!==n.id){ tooltip.replaceChildren(); const title=document.createElement('b'), body=document.createElement('span');
      title.textContent=n.label; body.textContent=n.description; tooltip.append(title,body); tooltip.dataset.id=n.id; }
    tooltip.classList.add('show'); const r=canvas.getBoundingClientRect(), gap=14;
    let x=e.clientX-r.left+gap, y=e.clientY-r.top+gap;
    x=Math.max(gap,Math.min(x,canvas.clientWidth-tooltip.offsetWidth-gap));
    y=Math.max(gap,Math.min(y,canvas.clientHeight-tooltip.offsetHeight-gap)); tooltip.style.transform=`translate(${x}px,${y}px)`; };
  canvas.addEventListener('pointermove',moveTip); canvas.addEventListener('pointerleave',hideTip);
  canvas.addEventListener('pointerdown',e=>{ if(e.button!==0) return; const st=canvas._state, el=e.target.closest('[data-tid]');
    fadeHint(); hideTip(); moved=false; gesture={x:e.clientX,y:e.clientY,tx:st.tx,ty:st.ty,id:el&&el.getAttribute('data-tid'),base:{...st.offsets}};
    canvas.setPointerCapture(e.pointerId); canvas.classList.add('grabbing'); });
  canvas.addEventListener('pointermove',e=>{ if(!gesture) return; const st=canvas._state, dx=e.clientX-gesture.x, dy=e.clientY-gesture.y;
    if(Math.hypot(dx,dy)<3) return; moved=true;
    if(!gesture.id){ st.tx=gesture.tx+dx; st.ty=gesture.ty+dy; navApply(canvas); return; }
    const graphDx=dx/st.k, graphDy=dy/st.k, dist={[gesture.id]:0}, queue=[gesture.id];
    while(queue.length){ const id=queue.shift(), next=[]; const p=st.parent[id]; if(p) next.push(p); (st.byId[id].children||[]).forEach(n=>next.push(n.id));
      next.forEach(n=>{ if(dist[n]==null){ dist[n]=dist[id]+1; queue.push(n); } }); }
    Object.keys(dist).forEach(id=>{ const pull=Math.exp(-dist[id]*.72), old=gesture.base[id]||{x:0,y:0};
      st.offsets[id]={x:old.x+graphDx*pull,y:old.y+graphDy*pull}; });
    if(!st.renderFrame) st.renderFrame=requestAnimationFrame(()=>{ st.renderFrame=null; navRender(canvas); });
  });
  const end=e=>{ if(!gesture) return; const clicked=gesture.id, didMove=moved; gesture=null; canvas.classList.remove('grabbing');
    if(e&&canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
    if(clicked&&!didMove) navOnNode(canvas,clicked); else if(clicked){ canvas._state.sel=clicked; navRender(canvas); }
  };
  canvas.addEventListener('pointerup',end); canvas.addEventListener('pointercancel',end);
  canvas.addEventListener('wheel', e=>{ e.preventDefault(); const st=canvas._state;
    const rect=canvas.getBoundingClientRect(), x=e.clientX-rect.left, y=e.clientY-rect.top;
    navZoomAt(canvas,e.deltaY<0?1.12:.89,x,y); fadeHint(); }, {passive:false});
  canvas.addEventListener('dblclick',e=>{ if(!e.target.closest('[data-tid]')) navFit(canvas,true); });
  new ResizeObserver(()=>{ if(canvas._state&&!canvas._state.dragged) navFit(canvas,true); }).observe(canvas);
}
function navZoomAt(c,f,x,y){ const st=c._state, next=Math.max(.035,Math.min(3.2,st.k*f)), ratio=next/st.k;
  st.tx=x-(x-st.tx)*ratio; st.ty=y-(y-st.ty)*ratio; st.k=next; st.dragged=true; navApply(c); }
function navZoom(btn,f){ const c=btn.closest('.nav-canvas'), st=c._state; if(!st) return;
  navZoomAt(c,f,c.clientWidth/2,c.clientHeight/2); }
function navReset(btn){ const c=btn.closest('.nav-canvas'), st=c._state; if(!st) return;
  st.offsets={}; st.dragged=false; navRender(c); navFit(c,true); }

// Any section may append open text fields after its main body (the "what is missing here?" prompt
// that every assessment task carries in the protocol).
function renderBody(sec){
  // Authored prose (sec.html) sits above the generated item list on every screen. Plain prose
  // screens and the task overview render it themselves, so it is not doubled for those two.
  const ownsProse = (!sec.kind || sec.kind==='group');
  const prose = (!ownsProse && sec.html) ? `<div class="prose">${sec.html}</div>` : '';
  const extra = (sec.extra_open&&sec.extra_open.length)
    ? `<div class="extra-open"><h3>${esc(sec.extra_open_title||'Aanvullen')}</h3>`
      + renderOpen({fields:sec.extra_open}) + `</div>` : '';
  return prose + renderKind(sec) + extra;
}
function renderKind(sec){
  switch(sec.kind){
    case 'flags':      return renderFlags(sec);
    case 'barriers':   return renderBarriers(sec);
    case 'background': return renderBackground(sec);
    case 'group':      return renderGroup(sec);
    case 'adjudicate': return renderAdjudicate(sec);
    case 'navigator':  return renderNavigator(sec);
    case 'open':       return renderOpen(sec);
    case 'done':       return renderDone(sec);
    default:           return renderProse(sec);
  }
}

// ---- counts ----------------------------------------------------------------
// One registry drives the badges, the per-task counters, the progress bar and the tick marks: every
// section reports the ids of the items it asks a judgement on. The cancer filter is deliberately not
// applied here, so the denominator does not move while someone is filtering.
function sectionItemIds(sec){
  switch(sec.kind){
    case 'flags':      return flagsFor(sec).map(f=>'flag:'+f.id);
    case 'barriers':   return barriersFor(sec).map(b=>'bar:'+b.id);
    case 'adjudicate': return ((DATA.adjudication&&DATA.adjudication[sec.dataset])||[]).map(i=>i.id);
    default:           return null;   // prose, open questions, background, map, closing
  }
}
function allItemIds(){
  const out=[]; CONTENT.sections.forEach(sec=>{const ids=sectionItemIds(sec); if(ids) out.push(...ids);});
  return out;
}
function answeredIn(sec){
  const ids=sectionItemIds(sec); if(!ids) return 0;
  return ids.filter(id=>answers[id]&&answers[id].choice).length;
}
function sectionCount(sec){ const ids=sectionItemIds(sec); return ids?ids.length:null; }
function sectionComplete(sec){
  const ids=sectionItemIds(sec);
  if(ids) return ids.length>0 && answeredIn(sec)===ids.length;
  if(sec.kind==='open') return (sec.fields||[]).some(f=>(answers['open:'+f.id]||{}).comment);
  if(sec.kind==='background') return (sec.fields||[]).filter(f=>f.required)
      .every(f=>{const a=answers['bg:'+f.id]||{}; return (a.value||'').trim();});
  return false;
}
function updateProgress(){
  const ids=allItemIds(), total=ids.length;
  const done=ids.filter(id=>answers[id]&&answers[id].choice).length;
  const pct=total?Math.round(done/total*100):0;
  const fill=document.getElementById('progress-fill'); if(fill) fill.style.width=pct+'%';
  const txt=document.getElementById('progress-text'); if(txt) txt.textContent=`${done} / ${total} beoordeeld`;
  CONTENT.sections.forEach(sec=>{
    const a=document.querySelector(`nav a[data-sec="${sec.id}"]`); if(!a) return;
    a.classList.toggle('done-mark', sectionComplete(sec));
    const badge=a.querySelector('.badge'); const c=sectionCount(sec);
    if(badge&&c!=null) badge.textContent=`${answeredIn(sec)}/${c}`;
  });
  const kpi=document.getElementById('kpi');
  if(kpi){ const set=new Set(ids), by={};
    ids.forEach(id=>{const a=answers[id]; if(a&&a.choice) by[a.choice]=(by[a.choice]||0)+1;});
    const open=CONTENT.sections.filter(s=>s.kind==='open')
      .reduce((n,s)=>n+(s.fields||[]).filter(f=>(answers['open:'+f.id]||{}).comment).length,0);
    kpi.innerHTML=`<div><b>${done}/${total}</b> beoordeeld</div><div><b>${by.ja||0}</b> Ja</div>
      <div><b>${by.misschien||0}</b> Misschien</div><div><b>${by.nee||0}</b> Nee</div>
      <div><b>${open}</b> open antwoorden</div>`; }
}

// ---- shell (nav + sections) ------------------------------------------------
// Section numbering. A section with level 2 is a task under the preceding level-1 section, so the
// sidebar reads 1., 2., 3., 3.1, 3.2, ... and every task carries its own visible number.
const NUMBERS={};
(function number(){
  let top=0, sub=0;
  CONTENT.sections.forEach(sec=>{
    if((sec.level||1)>=2){ sub++; NUMBERS[sec.id]=`${top}.${sub}`; }
    else { top++; sub=0; NUMBERS[sec.id]=String(top); }
  });
})();
function secNo(id){ return NUMBERS[id]||''; }
function childTasks(sec){
  const i=CONTENT.sections.indexOf(sec), out=[];
  for(let j=i+1;j<CONTENT.sections.length;j++){
    if((CONTENT.sections[j].level||1)<2) break;
    out.push(CONTENT.sections[j]);
  }
  return out;
}
function renderShell(){
  document.getElementById('h-title').textContent = CONTENT.header_title || '';
  document.getElementById('h-sub').textContent = CONTENT.header_sub || '';
  document.title = CONTENT.title || CONTENT.header_title || 'Workshop';

  document.getElementById('nav').innerHTML = CONTENT.sections.map((sec,i)=>{
    const c=sectionCount(sec), lvl=(sec.level||1)>=2?' lvl2':'';
    return `<a href="#" class="${lvl.trim()}${i===0?' active':''}" data-sec="${sec.id}" onclick="go('${sec.id}');return false"
      ><span class="no">${secNo(sec.id)}.</span><span class="lbl">${esc(sec.nav)}</span>
      ${c!=null?`<span class="badge">${c}</span>`:''}</a>`;
  }).join('');

  const S=CONTENT.sections;
  document.getElementById('main').innerHTML = S.map((sec,i)=>{
    const prev=S[i-1], next=S[i+1];
    const foot=`<div class="secnav">
      ${prev?`<button class="btn" onclick="go('${prev.id}')">&larr; ${secNo(prev.id)}. ${esc(prev.nav)}</button>`:'<span></span>'}
      ${next?`<button class="btn primary" onclick="go('${next.id}')">${secNo(next.id)}. ${esc(next.nav)} &rarr;</button>`:'<span></span>'}
    </div>`;
    return `<section id="${sec.id}" class="${i===0?'active':''}">
       ${(sec.level||1)>=2?`<div class="taskno">Taak ${secNo(sec.id)}</div>`:''}
       ${sec.title?`<h2>${esc(sec.title)}</h2>`:''}
       ${sec.lead?`<p class="lead">${sec.lead}</p>`:''}
       <div class="sec-body" data-sec="${sec.id}"></div>
       ${foot}
     </section>`;}).join('');
}
function renderBodies(){
  CONTENT.sections.forEach(sec=>{
    const el=document.querySelector(`.sec-body[data-sec="${sec.id}"]`);
    if(!el) return;
    // Preserve an already-mounted navigator (and its zoom/expand state) across re-renders.
    if(sec.kind==='navigator' && el.querySelector('.nav-block[data-mounted="1"]')) return;
    el.innerHTML = renderBody(sec);
  });
  mountNavigators();
  updateProgress();
}
// Only the flag task is cancer-specific, so the filter bar is shown there and hidden elsewhere:
// a filter that visibly does nothing reads as a broken control.
function sectionUsesCancerFilter(sec){ return !!sec && sec.kind==='flags'; }
function syncCancerBar(id){
  const bar=document.getElementById('cancerbar'); if(!bar) return;
  const sec=CONTENT.sections.find(s=>s.id===id);
  const show=CONTENT.show_cancer_filter && sectionUsesCancerFilter(sec);
  bar.classList.toggle('hidden', !show);
}
function go(id){
  document.querySelectorAll('section').forEach(s=>s.classList.toggle('active',s.id===id));
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.dataset.sec===id));
  syncCancerBar(id);
  window.scrollTo(0,0);
}
function setCancer(c, el){
  ACTIVE_CANCER = c;
  document.querySelectorAll('.cancerbar .cb').forEach(b=>b.classList.toggle('sel', b.dataset.c===c));
  const hint=document.getElementById('cb-hint');
  if(hint) hint.textContent = c==='all' ? 'Toont alles; kies een kanker om de review te focussen.'
                                        : 'Review gefocust op '+CANCER_NL[c]+'.';
  renderBodies();
}

// ---- export ----------------------------------------------------------------
function exportJSON(){
  // Enrich each judgement with its hidden metadata so the export is directly analysable
  // (participant choice vs model vs reference knowledge, control vs discrepancy item).
  const enriched={}, background={}, followup={};
  Object.entries(answers).forEach(([id,a])=>{
    if(id.startsWith('bg:')){ background[id.slice(3)]=a; return; }   // broken out, not duplicated
    if(id.startsWith('fu:')){ followup[id.slice(3)]=a; return; }
    const m = ADJ_INDEX[id];
    enriched[id] = m
      ? Object.assign({}, a, {item_kind:m.kind, dataset:m.dataset, task:m.task,
                              barrier:m.barrier, coping:m.coping, activity:m.activity, person:m.person,
                              model_label:m.llm_label, reference_label:m.expert_label,
                              model_probability:m.llm_prob})
      : a;
  });
  const ids=allItemIds();
  const payload={exported:new Date().toISOString(), workshop:CONTENT.mode,
                 schema_version:2,
                 build:{run_mode:DATA.run_mode||null, model:DATA.model||null,
                        built:DATA.built||null},
                 progress:{answered:ids.filter(i=>answers[i]&&answers[i].choice).length, total:ids.length},
                 background:background, followup:followup, answers:enriched};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  const stamp=new Date().toISOString().slice(0,10);
  a.href=url; a.download=`kanfit_workshop_${CONTENT.mode}_${stamp}.json`; a.click(); URL.revokeObjectURL(url);
}
function resetAll(){ if(confirm("Alle antwoorden wissen?")){ answers={}; save(); renderBodies(); } }

renderShell(); renderBodies(); syncCancerBar(CONTENT.sections[0].id);
