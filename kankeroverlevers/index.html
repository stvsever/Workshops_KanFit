ook mogelijkheden om de interventie verder te personaliseren, bijvoorbeeld op basis van de lichamelijke mogelijkheden, behoeften en voorkeuren van de deelnemer.</p><h3>Huidige workshop</h3><p>De workshop richt zich op het identificeren en valideren van barrières voor fysieke activiteit die specifiek kunnen voorkomen na kanker, en op mogelijke strategieën om met deze barrières om te gaan.</p><p>We zijn benieuwd naar jouw persoonlijke ervaring en mening. Het gaat dus niet om wat volgens jou medisch gezien juist of fout is, maar om wat jij herkent, relevant vindt en denkt dat in de praktijk zou kunnen helpen.</p><p>Je doorloopt de workshop op eigen tempo. Je kunt pauzeren en de workshop op een later moment hervatten. De geschatte duur van de workshop is ongeveer 1 uur.</p>"}, {"id": "achtergrond", "nav": "Over jou", "level": 1, "kind": "background", "title": "Mensen die kanker hebben gehad", "lead": "In deze workshop vragen we mensen die kanker hebben gehad om hun ervaringen en mening te delen over barrières om fysiek actief te zijn en mogelijke manieren om met deze barrières om te gaan.<br><br>We focussen ons in eerste instantie op mensen die borstkanker, prostaatkanker of darmkanker hebben gehad en die hun primaire behandeling hebben afgerond.<br><br>Vul je gegevens in:", "fields": [{"id": "diagnose", "label": "Welke kankerdiagnose heb je gehad?", "required": true, "options": ["Borstkanker", "Prostaatkanker", "Darmkanker", "Andere"], "allow_other": true, "hint": "Je kunt meerdere opties aanduiden als je meer dan één kankerdiagnose hebt gehad.", "other_placeholder": "Andere diagnose, of verduidelijking bij je keuze", "multi": true}, {"id": "behandeling", "label": "Welke behandeling(en) heb je gekregen?", "required": true, "options": ["Operatie", "Chemotherapie", "Bestraling", "Hormoontherapie", "Een combinatie hiervan", "Andere"], "allow_other": true, "hint": "Duid alle behandelingen aan die je hebt gehad. Je kunt extra informatie toevoegen in het tekstvak.", "other_placeholder": "Andere behandeling, of verduidelijking bij je keuze", "multi": true}, {"id": "tijd_sinds", "label": "Hoe lang geleden heb je je primaire behandeling afgerond?", "required": true, "options": ["Minder dan 6 maanden", "6 maanden tot 1 jaar", "1 tot 2 jaar", "2 tot 5 jaar", "Meer dan 5 jaar"], "hint": "Primaire behandeling: de eerste behandeling die je kreeg om de kanker te behandelen, zoals een operatie, chemotherapie of radiotherapie."}]}, {"id": "taken", "nav": "Taken", "level": 1, "kind": "group", "title": "De twee taken", "lead": "Deze workshop bestaat uit twee taken. Je mag ze in elke volgorde doorlopen en tussendoor pauzeren.", "html": "<p>In beide taken geef je telkens met één klik je mening. Daaronder kan je in eigen woorden uitleggen waarom. Dit is optioneel, maar juist deze uitleg helpt ons het meest. Onderaan elke taak vragen we ook wat er volgens jou nog ontbreekt.</p>"}, {"id": "taak_drempels", "nav": "Barrières", "level": 2, "kind": "barriers", "dataset": "experiential", "title": "Validatie van kankerspecifieke oranje vlaggen en barrières", "summary": "Beoordeel hoe relevant de voorgestelde barrières zijn.", "lead": "We beoordelen voorgestelde kankerspecifieke oranje vlaggen en barrières voor fysieke activiteit.", "html": "<div class=\"note\"><b>Definitie</b><br>🟠 <b>Oranje vlag:</b> een barrière die fysieke activiteit moeilijker of minder haalbaar kan maken. Om hiermee om te gaan, kan zelfmanagement, een copingstrategie of een aanpassing van de activiteit nodig zijn.</div>", "question": "In hoeverre vind je deze barrière relevant voor mensen die kanker hebben gehad en fysiek actief willen zijn?", "choices": {"ja": "Relevant", "misschien": "Soms relevant", "nee": "Niet relevant"}, "extra_open_title": "Slotvragen", "extra_open": [{"id": "missing_barriers", "label": "Ontbreken er volgens jou belangrijke barrières voor mensen die borstkanker, prostaatkanker of darmkanker hebben gehad en fysieke activiteit willen beoefenen? Zo ja, welke?", "placeholder": "Bijvoorbeeld: ik durfde niet meer, ik was bang om iets te forceren, ik schaamde me om te gaan sporten..."}, {"id": "priority_barriers", "label": "Prioritering (optioneel): welke 3 barrières vind je het belangrijkst om in een app zoals KanFit te tonen?", "placeholder": "1. ... 2. ... 3. ..."}]}, {"id": "taak_coping", "nav": "Copingstrategieën", "level": 2, "kind": "adjudicate", "dataset": "barrier_coping", "scenario_labels": {"barrier": "Barrière", "coping": "Copingstrategie"}, "title": "Validatie van de relatie tussen barrières en copingstrategieën", "summary": "Beoordeel of de voorgestelde copingstrategie zou helpen.", "lead": "Wanneer een bepaalde barrière het moeilijker maakt om fysiek actief te zijn, kan een copingstrategie helpen.", "html": "<div class=\"note\"><b>Definitie</b><br>🟢 <b>Copingstrategie:</b> een manier om met een barrière om te gaan, zodat je fysieke activiteit toch kunt uitvoeren of gemakkelijker kunt volhouden. Dit kan bijvoorbeeld door de activiteit, het tempo of de duur aan te passen, rustmomenten in te bouwen of een andere manier van bewegen te kiezen.</div>", "question": "Zou deze copingstrategie volgens jou helpen om met deze barrière om te gaan?", "choices": {"ja": "Ja", "misschien": "Misschien", "nee": "Nee"}, "extra_open_title": "Slotvragen", "extra_open": [{"id": "missing_coping", "label": "Zijn er volgens jou belangrijke manieren om met deze barrières om te gaan die nog ontbreken? Zo ja, welke?", "placeholder": "Bijvoorbeeld: samen met iemand afspreken, klein beginnen, een vast moment in de week..."}, {"id": "priority_coping", "label": "Prioritering (optioneel): welke 3 copingstrategieën vind je het belangrijkst om in een app zoals KanFit te tonen?", "placeholder": "1. ... 2. ... 3. ..."}]}, {"id": "afronden", "nav": "Afronden", "level": 1, "kind": "done", "title": "Einde", "lead": "Dit is het einde van de workshop. Bedankt voor je deelname en voor het delen van jouw ervaringen en ideeën. Jouw input helpt ons om KanFit zo goed mogelijk te laten aansluiten bij de ervaringen en behoeften van mensen die kanker hebben gehad. Kijk hieronder je voortgang na, beantwoord de twee laatste vragen en sla daarna je antwoorden op.", "followup_title": "Tot slot", "followup": [{"id": "valuable", "label": "Vond je het waardevol om op deze manier mee te denken?", "options": ["Ja", "Deels", "Nee"], "placeholder": "Wat vond je goed of net moeilijk? (optioneel)"}, {"id": "followup_session", "label": "Zou je willen deelnemen aan een korte online nabespreking waarin we de voorlopige resultaten overlopen?", "options": ["Ja", "Misschien", "Nee"], "placeholder": "Opmerkingen over de nabespreking (optioneel)"}], "submit_html": "<b>Bijna klaar.</b> Je antwoorden staan nu enkel op je eigen toestel. Om je antwoorden met ons te delen, sla je ze hieronder op als bestand en mail je dat naar <a href=\"mailto:emma.tack@ugent.be\">emma.tack@ugent.be</a>. Zolang je dit niet doet, ontvangen we je antwoorden niet.", "note": "Het bestand bevat je antwoorden en je uitleg, samen met de drie vragen over je situatie. Je naam staat er niet in. Het onderzoeksteam bewaart de bestanden gecodeerd en verwerkt ze vertrouwelijk, conform de GDPR en het gegevensbeschermingsbeleid van de UGent.<span class=\"thanks\">Bedankt voor het delen van je ervaring!</span>", "export_title": "Je antwoorden opslaan en doorsturen", "export_steps": ["Klik op de knop hieronder. Er wordt één bestand aangemaakt (<b>kanfit_workshop_cs_&lt;datum&gt;.json</b>), meestal in je map Downloads.", "Voeg dit bestand toe als bijlage aan een e-mail naar <b>emma.tack@ugent.be</b>. Een leeg mailtje volstaat.", "Klaar. Je mag deze pagina daarna sluiten. Je antwoorden blijven bewaard op dit toestel."]}]}  -> content.json  (de BEWERKBARE teksten en de sectie-indeling)

<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KanFit - Workshop voor kankeroverlevers</title>
<style>
  :root{
    --bg:#f5f7f8; --panel:#fff; --ink:#182029; --muted:#5b6673; --line:#e3e8ec;
    --brand:#1f6f6b; --brand-ink:#0e4f4b; --brand-soft:#e6f1f0;
    --red:#c0392b; --orange:#d98324; --yellow:#c9a227; --green:#2e8b57;
    /* Semantic colour coding: barrier = obstacle (amber), coping = solution (green), activity = brand. */
    --barrier:#c47f2a; --barrier-soft:#faf1e2; --barrier-ink:#8a5713;
    --coping:#2e8b57; --coping-soft:#e6f3ec; --coping-ink:#1e6b41;
    --activity:#1f6f6b; --activity-soft:#e6f1f0;
    --shadow:0 1px 3px rgba(20,30,45,.07),0 8px 22px rgba(20,30,45,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--ink);line-height:1.55}
  header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
         display:flex;align-items:center;gap:16px;padding:11px 22px;box-shadow:var(--shadow)}
  header h1{font-size:15px;margin:0;font-weight:700}
  header .sub{font-size:11.5px;color:var(--muted)}
  .spacer{flex:1}
  .progress{display:flex;align-items:center;gap:9px;white-space:nowrap}
  .progress .bar{width:120px;height:8px;border-radius:999px;background:#e3e8ec;overflow:hidden}
  .progress .fill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--brand),var(--green));
                  transition:width .35s ease}
  .progress .txt{font-size:12px;color:var(--brand-ink);font-weight:700}
  .btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;
       padding:8px 14px;font-size:13px;cursor:pointer;font-weight:600}
  .btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
  .btn:hover{filter:brightness(.97)}
  .storage-warn{background:#fff4e5;border-bottom:1px solid #f0d5a8;color:#7a4b06;
                padding:10px 22px;font-size:13px;line-height:1.5}
  .storage-warn.hidden{display:none}
  .cancerbar{position:sticky;top:56px;z-index:19;background:#0e4f4b;color:#fff;display:flex;
             align-items:center;gap:8px;padding:8px 22px;flex-wrap:wrap}
  .cancerbar.hidden{display:none}
  .cancerbar .cb-label{font-size:12px;opacity:.85;margin-right:4px;font-weight:600}
  .cb{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:999px;
      padding:5px 14px;font-size:12.5px;font-weight:700;cursor:pointer}
  .cb:hover{background:rgba(255,255,255,.12)}
  .cb.sel{background:#fff;color:#0e4f4b;border-color:#fff}
  .cb-hint{font-size:11.5px;opacity:.8;margin-left:auto}
  .layout{display:grid;grid-template-columns:250px 1fr;max-width:1200px;margin:0 auto}
  nav{position:sticky;top:95px;align-self:start;height:calc(100vh - 95px);overflow:auto;padding:16px 16px 16px 12px;
      border-right:2px solid var(--brand);background:rgba(255,255,255,.42)}
  nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;
        border-radius:8px;color:var(--muted);text-decoration:none;font-size:13px;font-weight:600}
  nav a:hover{background:#eceff1;color:var(--ink)}
  nav a.active{background:var(--brand);color:#fff}
  nav a .no{flex:0 0 auto;font-variant-numeric:tabular-nums;opacity:.75}
  nav a .lbl{flex:1;min-width:0}
  /* Task subsections (3.1 ... 3.4) are indented under their parent and set slightly smaller. */
  nav a.lvl2{margin-left:14px;padding:7px 11px;font-size:12.5px;font-weight:600;
             border-left:2px solid var(--line);border-radius:0 8px 8px 0}
  nav a.lvl2.active{border-left-color:var(--brand)}
  nav a.done-mark::after{content:'\2713';color:var(--green);font-weight:800;font-size:12px}

. Dit biedt ook mogelijkheden om de interventie verder te personaliseren, bijvoorbeeld op basis van de lichamelijke mogelijkheden, behoeften en voorkeuren van de deelnemer.</p><h3>Huidige workshop</h3><p>De workshop richt zich op het identificeren en valideren van barrières voor fysieke activiteit die specifiek kunnen voorkomen na kanker, en op mogelijke strategieën om met deze barrières om te gaan.</p><p>We zijn benieuwd naar jouw persoonlijke ervaring en mening. Het gaat dus niet om wat volgens jou medisch gezien juist of fout is, maar om wat jij herkent, relevant vindt en denkt dat in de praktijk zou kunnen helpen.</p><p>Je doorloopt de workshop op eigen tempo. Je kunt pauzeren en de workshop op een later moment hervatten. De geschatte duur van de workshop is ongeveer 1 uur.</p>"}, {"id": "achtergrond", "nav": "Over jou", "level": 1, "kind": "background", "title": "Mensen die kanker hebben gehad", "lead": "In deze workshop vragen we mensen die kanker hebben gehad om hun ervaringen en mening te delen over barrières om fysiek actief te zijn en mogelijke manieren om met deze barrières om te gaan.<br><br>We focussen ons in eerste instantie op mensen die borstkanker, prostaatkanker of darmkanker hebben gehad en die hun primaire behandeling hebben afgerond.<br><br>Vul je gegevens in:", "fields": [{"id": "diagnose", "label": "Welke kankerdiagnose heb je gehad?", "required": true, "options": ["Borstkanker", "Prostaatkanker", "Darmkanker", "Andere"], "allow_other": true, "hint": "Je kunt meerdere opties aanduiden als je meer dan één kankerdiagnose hebt gehad.", "other_placeholder": "Andere diagnose, of verduidelijking bij je keuze", "multi": true}, {"id": "behandeling", "label": "Welke behandeling(en) heb je gekregen?", "required": true, "options": ["Operatie", "Chemotherapie", "Bestraling", "Hormoontherapie", "Een combinatie hiervan", "Andere"], "allow_other": true, "hint": "Duid alle behandelingen aan die je hebt gehad. Je kunt extra informatie toevoegen in het tekstvak.", "other_placeholder": "Andere behandeling, of verduidelijking bij je keuze", "multi": true}, {"id": "tijd_sinds", "label": "Hoe lang geleden heb je je primaire behandeling afgerond?", "required": true, "options": ["Minder dan 6 maanden", "6 maanden tot 1 jaar", "1 tot 2 jaar", "2 tot 5 jaar", "Meer dan 5 jaar"], "hint": "Primaire behandeling: de eerste behandeling die je kreeg om de kanker te behandelen, zoals een operatie, chemotherapie of radiotherapie."}]}, {"id": "taken", "nav": "Taken", "level": 1, "kind": "group", "title": "De twee taken", "lead": "Deze workshop bestaat uit twee taken. Je mag ze in elke volgorde doorlopen en tussendoor pauzeren.", "html": "<p>In beide taken geef je telkens met één klik je mening. Daaronder kan je in eigen woorden uitleggen waarom. Dit is optioneel, maar juist deze uitleg helpt ons het meest. Onderaan elke taak vragen we ook wat er volgens jou nog ontbreekt.</p>"}, {"id": "taak_drempels", "nav": "Barrières", "level": 2, "kind": "barriers", "dataset": "experiential", "title": "Validatie van kankerspecifieke oranje vlaggen en barrières", "summary": "Beoordeel hoe relevant de voorgestelde barrières zijn.", "lead": "We beoordelen voorgestelde kankerspecifieke oranje vlaggen en barrières voor fysieke activiteit.", "html": "<div class=\"note\"><b>Definitie</b><br>🟠 <b>Oranje vlag:</b> een barrière die fysieke activiteit moeilijker of minder haalbaar kan maken. Om hiermee om te gaan, kan zelfmanagement, een copingstrategie of een aanpassing van de activiteit nodig zijn.</div>", "question": "In hoeverre vind je deze barrière relevant voor mensen die kanker hebben gehad en fysiek actief willen zijn?", "choices": {"ja": "Relevant", "misschien": "Soms relevant", "nee": "Niet relevant"}, "extra_open_title": "Slotvragen", "extra_open": [{"id": "missing_barriers", "label": "Ontbreken er volgens jou belangrijke barrières voor mensen die borstkanker, prostaatkanker of darmkanker hebben gehad en fysieke activiteit willen beoefenen? Zo ja, welke?", "placeholder": "Bijvoorbeeld: ik durfde niet meer, ik was bang om iets te forceren, ik schaamde me om te gaan sporten..."}, {"id": "priority_barriers", "label": "Prioritering (optioneel): welke 3 barrières vind je het belangrijkst om in een app zoals KanFit te tonen?", "placeholder": "1. ... 2. ... 3. ..."}]}, {"id": "taak_coping", "nav": "Copingstrategieën", "level": 2, "kind": "adjudicate", "dataset": "barrier_coping", "scenario_labels": {"barrier": "Barrière", "coping": "Copingstrategie"}, "title": "Validatie van de relatie tussen barrières en copingstrategieën", "summary": "Beoordeel of de voorgestelde copingstrategie zou helpen.", "lead": "Wanneer een bepaalde barrière het moeilijker maakt om fysiek actief te zijn, kan een copingstrategie helpen.", "html": "<div class=\"note\"><b>Definitie</b><br>🟢 <b>Copingstrategie:</b> een manier om met een barrière om te gaan, zodat je fysieke activiteit toch kunt uitvoeren of gemakkelijker kunt volhouden. Dit kan bijvoorbeeld door de activiteit, het tempo of de duur aan te passen, rustmomenten in te bouwen of een andere manier van bewegen te kiezen.</div>", "question": "Zou deze copingstrategie volgens jou helpen om met deze barrière om te gaan?", "choices": {"ja": "Ja", "misschien": "Misschien", "nee": "Nee"}, "extra_open_title": "Slotvragen", "extra_open": [{"id": "missing_coping", "label": "Zijn er volgens jou belangrijke manieren om met deze barrières om te gaan die nog ontbreken? Zo ja, welke?", "placeholder": "Bijvoorbeeld: samen met iemand afspreken, klein beginnen, een vast moment in de week..."}, {"id": "priority_coping", "label": "Prioritering (optioneel): welke 3 copingstrategieën vind je het belangrijkst om in een app zoals KanFit te tonen?", "placeholder": "1. ... 2. ... 3. ..."}]}, {"id": "afronden", "nav": "Afronden", "level": 1, "kind": "done", "title": "Einde", "lead": "Dit is het einde van de workshop. Bedankt voor je deelname en voor het delen van jouw ervaringen en ideeën. Jouw input helpt ons om KanFit zo goed mogelijk te laten aansluiten bij de ervaringen en behoeften van mensen die kanker hebben gehad. Kijk hieronder je voortgang na, beantwoord de twee laatste vragen en sla daarna je antwoorden op.", "followup_title": "Tot slot", "followup": [{"id": "valuable", "label": "Vond je het waardevol om op deze manier mee te denken?", "options": ["Ja", "Deels", "Nee"], "placeholder": "Wat vond je goed of net moeilijk? (optioneel)"}, {"id": "followup_session", "label": "Zou je willen deelnemen aan een korte online nabespreking waarin we de voorlopige resultaten overlopen?", "options": ["Ja", "Misschien", "Nee"], "placeholder": "Opmerkingen over de nabespreking (optioneel)"}], "submit_html": "<b>Bijna klaar.</b> Je antwoorden staan nu enkel op je eigen toestel. Om je antwoorden met ons te delen, sla je ze hieronder op als bestand en mail je dat naar <a href=\"mailto:emma.tack@ugent.be\">emma.tack@ugent.be</a>. Zolang je dit niet doet, ontvangen we je antwoorden niet.", "note": "Het bestand bevat je antwoorden en je uitleg, samen met de drie vragen over je situatie. Je naam staat er niet in. Het onderzoeksteam bewaart de bestanden gecodeerd en verwerkt ze vertrouwelijk, conform de GDPR en het gegevensbeschermingsbeleid van de UGent.<span class=\"thanks\">Bedankt voor het delen van je ervaring!</span>", "export_title": "Je antwoorden opslaan en doorsturen", "export_steps": ["Klik op de knop hieronder. Er wordt één bestand aangemaakt (<b>kanfit_workshop_cs_&lt;datum&gt;.json</b>), meestal in je map Downloads.", "Voeg dit bestand toe als bijlage aan een e-mail naar <b>emma.tack@ugent.be</b>. Een leeg mailtje volstaat.", "Klaar. Je mag deze pagina daarna sluiten. Je antwoorden blijven bewaard op dit toestel."]}]};

const STORE_KEY = "coppercan_workshop_" + CONTENT.mode;

// ---- persistent storage, and what to do when there is none -------------------------------
// Two things can go wrong, and neither may take the page down. The browser can refuse storage
// outright (all site data blocked, a managed browser, a file:// origin in some browsers), in which
// case even touching localStorage throws; or the stored value can be corrupt, in which case parsing
// it throws. Either would abort this script at load and leave the participant a blank page, which
// is the worst possible failure for a link that goes out by mail.
//
// So storage is probed once and treated as optional. Without it the workshop still works and the
// export still works, because both read from `answers` in memory; only pausing and resuming is
// lost, and the participant is told so rather than finding out afterwards.
const STORE = (function(){
  try {
    const probe = "__kanfit_probe__";
    localStorage.setItem(probe, "1");
    localStorage.removeItem(probe);
    return localStorage;
  } catch(e){ return null; }
})();
function loadAnswers(){
  if(!STORE) return {};
  try { return JSON.parse(STORE.getItem(STORE_KEY) || "{}") || {}; }
  catch(e){ return {}; }   // corrupt value: start clean rather than break the page
}
let answers = loadAnswers();
let storageOK = STORE !== null;
let ACTIVE_CANCER = "all";
const CANCER_NL = {all:"alle kankersoorten", breast:"borstkanker", prostate:"prostaatkanker", colorectal:"darmkanker"};

// ---- helpers ---------------------------------------------------------------
function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function cancerNL(c){ return (DATA.cancer_labels&&DATA.cancer_labels[c])||CANCER_NL[c]||c; }
function cancerTags(list){ return (list||[]).map(c=>`<span class="ctag">${cancerNL(c)}</span>`).join(''); }
function flagMatches(f){ return ACTIVE_CANCER==='all' || !f.cancers || f.cancers.length===0 || f.cancers.includes(ACTIVE_CANCER); }

// Flat index of every adjudication item, keyed by id (for the enriched export).
const ADJ_INDEX = {};
Object.entries(DATA.adjudication||{}).forEach(([dataset, items])=>{
  (items||[]).forEach(it=>{ ADJ_INDEX[it.id] = Object.assign({dataset}, it); });
});

// ---- answer storage --------------------------------------------------------
function save(){
  if(STORE){
    // Can still fail after the probe succeeded: the quota is per origin and is reached by writing,
    // not by probing. An answer that cannot be stored is kept in memory and still exported.
    try { STORE.setItem(STORE_KEY, JSON.stringify(answers)); }
    catch(e){ storageOK = false; }
  }
  syncStorageWarning();
  updateProgress();
}
function syncStorageWarning(){
  const bar = document.getElementById("storage-warning");
  if(bar) bar.classList.toggle("hidden", storageOK);
}
// Only when nothing is being kept on the device: then closing the tab really does lose the answers.
window.addEventListener("beforeunload", function(e){
  if(!storageOK && Object.keys(answers).length){ e.preventDefault(); e.returnValue = ""; }
});
function setAnswer(id, field, val){ answers[id]=answers[id]||{}; answers[id][field]=val; save(); }
function pick(id,val,el){ setAnswer(id,'choice',val);
  el.parentElement.querySelectorAll('.choice').forEach(c=>c.classList.remove('sel')); el.classList.add('sel'); }
function choiceRow(id, opts){
  const a=answers[id]||{};

// ---- interactive concept-map navigator ------------------------------------
// A node-link graph of the knowledge base (chips + links) with three switchable

  const lay=(id,lbl,sel)=>`<button data-layout="${id}" class="${sel?'sel':''}" onclick="navSetLayout(this)">${lbl}</button>`;
  return `<div class="nav-block" data-first="${ids[0]}" data-mounted="0">

    </div>

        <button aria-label="Uitzoomen" title="Uitzoomen" onclick="navZoom(this,0.85)">&minus;</button>

    </div>
  </div>`;
}
function mountNavigators(){
  document.querySelectorAll('.nav-block[data-mounted="0"]').forEach(block=>{
    block.dataset.mounted='1';
    const t=(block.querySelector('.nav-tab.sel')||{}).dataset?.tree || block.dataset.first;
    if(DATA.trees&&DATA.trees[t]) mountTree(block.querySelector('.nav-canvas'), DATA.trees[t]);
  });
}
function navTab(btn){
  const block=btn.closest('.nav-block');

}
function navSetLayout(btn){
  const canvas=btn.closest('.nav-block').querySelector('.nav-canvas'); if(!canvas._state) return;

  st.expanded=new Set([st.tree.id]);
}
function navUpdateExpand(canvas){
  const b=canvas.closest('.nav-block').querySelector('.nav-expand'); if(!b) return;
  const all=Object.values(canvas._state.byId).filter(n=>n.children&&n.children.length);
  const open=all.length&&all.every(n=>canvas._state.expanded.has(n.id));

}

function navClip(s,mode){ const max=mode==='radial'?20:38; return s.length>max?s.slice(0,max-1)+'…':s; }

function navRadialLayout(st,list){

      runners+=`<circle class="nv-runner" r="4.2"><animateMotion dur=".88s" begin="${((i-1)*.1).toFixed(2)}s" repeatCount="indefinite" path="${seg}"/></circle>`;
    } }
  const svg=`<svg xmlns="http://www.w3.org/2000/svg"><g class="vp" transform="translate(${st.tx.toFixed(1)},${st.ty.toFixed(1)}) scale(${st.k.toFixed(3)})">`
    +`<g>${links}</g>${sp?`<path class="sel-path" d="${sp}"/>`:''}<g>${chips}</g>`
    +runners
    +`</g></svg>`;
  canvas.querySelector('.nav-svg').innerHTML=svg;
  st.lastPos=pos;
}
function navFitValues(canvas){
  const st=canvas._state, {pos}=navComputeLayout(canvas), ps=Object.values(pos); if(!ps.length) return;
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  ps.forEach(p=>{
    if(st.layout==='radial'){ const L=navChipW(p.n.label,'radial')+8, a=p.angle||0, ex=p.x+L*Math.cos(a), ey=p.y+L*Math.sin(a);
      minX=Math.min(minX,p.x-8,ex); maxX=Math.max(maxX,p.x+8,ex); minY=Math.min(minY,p.y-8,ey); maxY=Math.max(maxY,p.y+8,ey); }
    else { const hw=navChipW(p.n.label,st.layout)/2+10; minX=Math.min(minX,p.x-hw); maxX=Math.max(maxX,p.x+hw);
           minY=Math.min(minY,p.y-18); maxY=Math.max(maxY,p.y+18); } });
  const W=canvas.clientWidth||700, H=canvas.clientHeight||500, pad=34;
  const k=Math.max(.035, Math.min(1.15, Math.min(W/((maxX-minX)+pad*2), H/((maxY-minY)+pad*2))));
  return {k,tx:W/2-((minX+maxX)/2)*k,ty:H/2-((minY+maxY)/2)*k};
}
function navFit(canvas,smooth){
  const st=canvas._state, target=navFitValues(canvas); if(!target) return;
  if(!smooth){ Object.assign(st,target); return; }
  navAnimateView(canvas,target);
}
function navAnimateView(canvas,target){
  const st=canvas._state, start={tx:st.tx,ty:st.ty,k:st.k}, begun=performance.now(), duration=300;
  if(st.viewFrame) cancelAnimationFrame(st.viewFrame);
  const tick=now=>{ const t=Math.min(1,(now-begun)/duration), e=1-Math.pow(1-t,3);
    st.tx=start.tx+(target.tx-start.tx)*e; st.ty=start.ty+(target.ty-start.ty)*e; st.k=start.k+(target.k-start.k)*e;
    navApply(canvas); if(t<1) st.viewFrame=requestAnimationFrame(tick); else st.viewFrame=null; };
  st.viewFrame=requestAnimationFrame(tick);
}
function navApply(canvas){ const st=canvas._state, vp=canvas.querySelector('.vp');
  if(vp) vp.setAttribute('transform',`translate(${st.tx.toFixed(1)},${st.ty.toFixed(1)}) scale(${st.k.toFixed(3)})`); }
function navRevealBranch(canvas,id){
  const st=canvas._state, n=st.byId[id], ids=new Set([id,...(n.children||[]).map(c=>c.id)]), rects=[];
  canvas.querySelectorAll('.nv-node').forEach(el=>{ if(ids.has(el.getAttribute('data-tid'))) rects.push(el.getBoundingClientRect()); });
  if(!rects.length) return; const cr=canvas.getBoundingClientRect(), pad=30, rightPad=84;
  const left=Math.min(...rects.map(r=>r.left)), right=Math.max(...rects.map(r=>r.right));
  const top=Math.min(...rects.map(r=>r.top)), bottom=Math.max(...rects.map(r=>r.bottom));
  const availW=cr.width-pad-rightPad, availH=cr.height-pad*2;
  if(right-left>availW||bottom-top>availH) return;
  let dx=0,dy=0; if(left<cr.left+pad) dx=cr.left+pad-left; else if(right>cr.right-rightPad) dx=cr.right-rightPad-right;
  if(top<cr.top+pad) dy=cr.top+pad-top; else if(bottom>cr.bottom-pad) dy=cr.bottom-pad-bottom;
  if(Math.abs(dx)>1||Math.abs(dy)>1) navAnimateView(canvas,{tx:st.tx+dx,ty:st.ty+dy,k:st.k});
}
function navOnNode(canvas,id){ const st=canvas._state, n=st.byId[id]; if(!n) return;
  let ancestor=st.parent[id]; while(ancestor!=null){ st.expanded.add(ancestor); ancestor=st.parent[ancestor]; }
  const opening=!!(n.children&&n.children.length&&!st.expanded.has(id));
  if(n.children&&n.children.length){ opening?st.expanded.add(id):st.expanded.delete(id); }
  st.sel=id; navRender(canvas); if(opening) navRevealBranch(canvas,id); navUpdateExpand(canvas); }
function navWire(canvas){
  let gesture=null, moved=false;
  const fadeHint=()=>{ const h=canvas.querySelector('.nav-hint'); if(h) h.classList.add('hid'); };
  const tooltip=canvas.querySelector('.nav-tooltip');
  const hideTip=()=>tooltip&&tooltip.classList.remove('show');
  const moveTip=e=>{ if(!tooltip) return; const el=e.target.closest('[data-tid]'), n=el&&canvas._state.byId[el.getAttribute('data-tid')];
    if(!n||n.children&&n.children.length||!n.description){ hideTip(); return; }
    if(tooltip.dataset.id!==n.id){ tooltip.replaceChildren(); const title=document.createElement('b'), body=document.createElement('span');
      title.textContent=n.label; body.textContent=n.description; tooltip.append(title,body); tooltip.dataset.id=n.id; }
    tooltip.classList.add('show'); const r=canvas.getBoundingClientRect(), gap=14;
    let x=e.clientX-r.left+gap, y=e.clientY-r.top+gap;
    x=Math.max(gap,Math.min(x,canvas.clientWidth-tooltip.offsetWidth-gap));
    y=Math.max(gap,Math.min(y,canvas.clientHeight-tooltip.offsetHeight-gap)); tooltip.style.transform=`translate(${x}px,${y}px)`; };
  canvas.addEventListener('pointermove',moveTip); canvas.addEventListener('pointerleave',hideTip);
  canvas.addEventListener('pointerdown',e=>{ if(e.button!==0) return; const st=canvas._state, el=e.target.closest('[data-tid]');
    fadeHint(); hideTip(); moved=false; gesture={x:e.clientX,y:e.clientY,tx:st.tx,ty:st.ty,id:el&&el.getAttribute('data-tid'),base:{...st.offsets}};
    canvas.setPointerCapture(e.pointerId); canvas.classList.add('grabbing'); });
  canvas.addEventListener('pointermove',e=>{ if(!gesture) return; const st=canvas._state, dx=e.clientX-gesture.x, dy=e.clientY-gesture.y;
    if(Math.hypot(dx,dy)<3) return; moved=true;
    if(!gesture.id){ st.tx=gesture.tx+dx; st.ty=gesture.ty+dy; navApply(canvas); return; }
    const graphDx=dx/st.k, graphDy=dy/st.k, dist={[gesture.id]:0}, queue=[gesture.id];
    while(queue.length){ const id=queue.shift(), next=[]; const p=st.parent[id]; if(p) next.push(p); (st.byId[id].children||[]).forEach(n=>next.push(n.id));
      next.forEach(n=>{ if(dist[n]==null){ dist[n]=dist[id]+1; queue.push(n); } }); }
    Object.keys(dist).forEach(id=>{ const pull=Math.exp(-dist[id]*.72), old=gesture.base[id]||{x:0,y:0};
      st.offsets[id]={x:old.x+graphDx*pull,y:old.y+graphDy*pull}; });
    if(!st.renderFrame) st.renderFrame=requestAnimationFrame(()=>{ st.renderFrame=null; navRender(canvas); });
  });
  const end=e=>{ if(!gesture) return; const clicked=gesture.id, didMove=moved; gesture=null; canvas.classList.remove('grabbing');
    if(e&&canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
    if(clicked&&!didMove) navOnNode(canvas,clicked); else if(clicked){ canvas._state.sel=clicked; navRender(canvas); }
  };
  canvas.addEventListener('pointerup',end); canvas.addEventListener('pointercancel',end);
  canvas.addEventListener('wheel', e=>{ e.preventDefault(); const st=canvas._state;
    const rect=canvas.getBoundingClientRect(), x=e.clientX-rect.left, y=e.clientY-rect.top;
    navZoomAt(canvas,e.deltaY<0?1.12:.89,x,y); fadeHint(); }, {passive:false});
  canvas.addEventListener('dblclick',e=>{ if(!e.target.closest('[data-tid]')) navFit(canvas,true); });
  new ResizeObserver(()=>{ if(canvas._state&&!canvas._state.dragged) navFit(canvas,true); }).observe(canvas);
}
function navZoomAt(c,f,x,y){ const st=c._state, next=Math.max(.035,Math.min(3.2,st.k*f)), ratio=next/st.k;
  st.tx=x-(x-st.tx)*ratio; st.ty=y-(y-st.ty)*ratio; st.k=next; st.dragged=true; navApply(c); }
function navZoom(btn,f){ const c=btn.closest('.nav-canvas'), st=c._state; if(!st) return;
  navZoomAt(c,f,c.clientWidth/2,c.clientHeight/2); }
function navReset(btn){ const c=btn.closest('.nav-canvas'), st=c._state; if(!st) return;
  st.offsets={}; st.dragged=false; navRender(c); navFit(c,true); }

// Any section may append open text fields after its main body (the "what is missing here?" prompt
// that every assessment task carries in the protocol).
function renderBody(sec){
  // Authored prose (sec.html) sits above the generated item list on every screen. Plain prose
  // screens and the task overview render it themselves, so it is not doubled for those two.
  const ownsProse = (!sec.kind || sec.kind==='group');
  const prose = (!ownsProse && sec.html) ? `<div class="prose">${sec.html}</div>` : '';
  const extra = (sec.extra_open&&sec.extra_open.length)
    ? `<div class="extra-open"><h3>${esc(sec.extra_open_title||'Aanvullen')}</h3>`
      + renderOpen({fields:sec.extra_open}) + `</div>` : '';
  return prose + renderKind(sec) + extra;
}
function renderKind(sec){
  switch(sec.kind){
    case 'flags':      return renderFlags(sec);
    case 'barriers':   return renderBarriers(sec);
    case 'background': return renderBackground(sec);
    case 'group':      return renderGroup(sec);
    case 'adjudicate': return renderAdjudicate(sec);
    case 'navigator':  return renderNavigator(sec);
    case 'open':       return renderOpen(sec);
    case 'done':       return renderDone(sec);
    default:           return renderProse(sec);
  }
}

// ---- counts ----------------------------------------------------------------
// One registry drives the badges, the per-task counters, the progress bar and the tick marks: every
// section reports the ids of the items it asks a judgement on. The cancer filter is deliberately not
// applied here, so the denominator does not move while someone is filtering.
function sectionItemIds(sec){
  switch(sec.kind){
    case 'flags':      return flagsFor(sec).map(f=>'flag:'+f.id);
    case 'barriers':   return barriersFor(sec).map(b=>'bar:'+b.id);
    case 'adjudicate': return ((DATA.adjudication&&DATA.adjudication[sec.dataset])||[]).map(i=>i.id);
    default:           return null;   // prose, open questions, background, map, closing
  }
}
function allItemIds(){
  const out=[]; CONTENT.sections.forEach(sec=>{const ids=sectionItemIds(sec); if(ids) out.push(...ids);});
  return out;
}
function answeredIn(sec){
  const ids=sectionItemIds(sec); if(!ids) return 0;
  return ids.filter(id=>answers[id]&&answers[id].choice).length;
}
function sectionCount(sec){ const ids=sectionItemIds(sec); return ids?ids.length:null; }
function sectionComplete(sec){
  const ids=sectionItemIds(sec);
  if(ids) return ids.length>0 && answeredIn(sec)===ids.length;
  if(sec.kind==='open') return (sec.fields||[]).some(f=>(answers['open:'+f.id]||{}).comment);
  if(sec.kind==='background') return (sec.fields||[]).filter(f=>f.required)
      .every(f=>{const a=answers['bg:'+f.id]||{}; return (a.value||'').trim();});
  return false;
}
function updateProgress(){
  const ids=allItemIds(), total=ids.length;
  const done=ids.filter(id=>answers[id]&&answers[id].choice).length;
  const pct=total?Math.round(done/total*100):0;
  const fill=document.getElementById('progress-fill'); if(fill) fill.style.width=pct+'%';
  const txt=document.getElementById('progress-text'); if(txt) txt.textContent=`${done} / ${total} beoordeeld`;
  CONTENT.sections.forEach(sec=>{
    const a=document.querySelector(`nav a[data-sec="${sec.id}"]`); if(!a) return;
    a.classList.toggle('done-mark', sectionComplete(sec));
    const badge=a.querySelector('.badge'); const c=sectionCount(sec);
    if(badge&&c!=null) badge.textContent=`${answeredIn(sec)}/${c}`;
  });
  const kpi=document.getElementById('kpi');
  if(kpi){ const set=new Set(ids), by={};
    ids.forEach(id=>{const a=answers[id]; if(a&&a.choice) by[a.choice]=(by[a.choice]||0)+1;});
    const open=CONTENT.sections.filter(s=>s.kind==='open')
      .reduce((n,s)=>n+(s.fields||[]).filter(f=>(answers['open:'+f.id]||{}).comment).length,0);
    kpi.innerHTML=`<div><b>${done}/${total}</b> beoordeeld</div><div><b>${by.ja||0}</b> Ja</div>
      <div><b>${by.misschien||0}</b> Misschien</div><div><b>${by.nee||0}</b> Nee</div>
      <div><b>${open}</b> open antwoorden</div>`; }
}

// ---- shell (nav + sections) ------------------------------------------------
// Section numbering. A section with level 2 is a task under the preceding level-1 section, so the
// sidebar reads 1., 2., 3., 3.1, 3.2, ... and every task carries its own visible number.
const NUMBERS={};
(function number(){
  let top=0, sub=0;
  CONTENT.sections.forEach(sec=>{
    if((sec.level||1)>=2){ sub++; NUMBERS[sec.id]=`${top}.${sub}`; }
    else { top++; sub=0; NUMBERS[sec.id]=String(top); }
  });
})();
function secNo(id){ return NUMBERS[id]||''; }
function childTasks(sec){
  const i=CONTENT.sections.indexOf(sec), out=[];
  for(let j=i+1;j<CONTENT.sections.length;j++){
    if((CONTENT.sections[j].level||1)<2) break;
    out.push(CONTENT.sections[j]);
  }
  return out;
}
function renderShell(){
  document.getElementById('h-title').textContent = CONTENT.header_title || '';
  document.getElementById('h-sub').textContent = CONTENT.header_sub || '';
  document.title = CONTENT.title || CONTENT.header_title || 'Workshop';

  document.getElementById('nav').innerHTML = CONTENT.sections.map((sec,i)=>{
    const c=sectionCount(sec), lvl=(sec.level||1)>=2?' lvl2':'';
    return `<a href="#" class="${lvl.trim()}${i===0?' active':''}" data-sec="${sec.id}" onclick="go('${sec.id}');return false"
      ><span class="no">${secNo(sec.id)}.</span><span class="lbl">${esc(sec.nav)}</span>
      ${c!=null?`<span class="badge">${c}</span>`:''}</a>`;
  }).join('');

  const S=CONTENT.sections;
  document.getElementById('main').innerHTML = S.map((sec,i)=>{
    const prev=S[i-1], next=S[i+1];
    const foot=`<div class="secnav">
      ${prev?`<button class="btn" onclick="go('${prev.id}')">&larr; ${secNo(prev.id)}. ${esc(prev.nav)}</button>`:'<span></span>'}
      ${next?`<button class="btn primary" onclick="go('${next.id}')">${secNo(next.id)}. ${esc(next.nav)} &rarr;</button>`:'<span></span>'}
    </div>`;
    return `<section id="${sec.id}" class="${i===0?'active':''}">
       ${(sec.level||1)>=2?`<div class="taskno">Taak ${secNo(sec.id)}</div>`:''}
       ${sec.title?`<h2>${esc(sec.title)}</h2>`:''}
       ${sec.lead?`<p class="lead">${sec.lead}</p>`:''}
       <div class="sec-body" data-sec="${sec.id}"></div>
       ${foot}
     </section>`;}).join('');
}
function renderBodies(){
  CONTENT.sections.forEach(sec=>{
    const el=document.querySelector(`.sec-body[data-sec="${sec.id}"]`);
    if(!el) return;
    // Preserve an already-mounted navigator (and its zoom/expand state) across re-renders.
    if(sec.kind==='navigator' && el.querySelector('.nav-block[data-mounted="1"]')) return;
    el.innerHTML = renderBody(sec);
  });
  mountNavigators();
  updateProgress();
}
// Only the flag task is cancer-specific, so the filter bar is shown there and hidden elsewhere:
// a filter that visibly does nothing reads as a broken control.
function sectionUsesCancerFilter(sec){ return !!sec && sec.kind==='flags'; }
function syncCancerBar(id){
  const bar=document.getElementById('cancerbar'); if(!bar) return;
  const sec=CONTENT.sections.find(s=>s.id===id);
  const show=CONTENT.show_cancer_filter && sectionUsesCancerFilter(sec);
  bar.classList.toggle('hidden', !show);
}
function go(id){
  document.querySelectorAll('section').forEach(s=>s.classList.toggle('active',s.id===id));
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.dataset.sec===id));
  syncCancerBar(id);
  window.scrollTo(0,0);
}
function setCancer(c, el){
  ACTIVE_CANCER = c;
  document.querySelectorAll('.cancerbar .cb').forEach(b=>b.classList.toggle('sel', b.dataset.c===c));
  const hint=document.getElementById('cb-hint');
  if(hint) hint.textContent = c==='all' ? 'Toont alles; kies een kanker om de review te focussen.'
                                        : 'Review gefocust op '+CANCER_NL[c]+'.';
  renderBodies();
}

// ---- export ----------------------------------------------------------------
// The exported file has to stand on its own. It is mailed to the research team without the page it
// came from, so an entry like {"bar:exp_1": {"choice": "ja"}} is not enough: nobody can tell which
// barrier that was, and "ja" means "Relevant" in one task and "Akkoord" in another. Every item
// therefore carries the question it answered, the text of what was judged, and the label of the
// button that was pressed. Items are written in the order the participant saw them, not the order
// they happened to answer them in, and unanswered items are included too, so a skipped item is
// visibly skipped rather than silently absent.
function plainText(html){
  const d = document.createElement("div");
  d.innerHTML = html || "";
  return (d.textContent || "").replace(/\s+/g, " ").trim();
}
function answerOf(id, sec){
  const a = answers[id] || {};
  const opts = sec.choices || {};
  return {answered: !!a.choice,
          choice: a.choice || null,
          choice_label: a.choice ? (opts[a.choice] || a.choice) : null,
          comment: a.comment || ""};
}
function exportItems(){
  const items = [];
  CONTENT.sections.forEach(sec => {
    const common = pos => ({position: pos, section: sec.id, task: secNo(sec.id),
                            task_title: sec.title || sec.nav,
                            question: plainText(sec.question || "")});
    if(sec.kind === "flags"){
      flagsFor(sec).forEach(f => items.push(Object.assign(common(items.length + 1), {
        id: "flag:" + f.id, item_type: "flag", level: f.level, group: f.group,
        cancers: f.cancers || [], label: f.label, description: f.description,
        sources: f.sources || []}, answerOf("flag:" + f.id, sec))));
    }
    if(sec.kind === "barriers"){
      barriersFor(sec).forEach(b => items.push(Object.assign(common(items.length + 1), {
        id: "bar:" + b.id, item_type: "barrier", dataset: sec.dataset, group: b.group,
        cancers: b.cancers || [], domain: b.domain || null, label: b.label,
        description: b.description || ""}, answerOf("bar:" + b.id, sec))));
    }
    if(sec.kind === "adjudicate"){
      ((DATA.adjudication && DATA.adjudication[sec.dataset]) || []).forEach(it =>
        items.push(Object.assign(common(items.length + 1), {
          id: it.id, item_type: "pair", dataset: sec.dataset,
          activity: it.activity || null, barrier: it.barrier || null, coping: it.coping || null,
          // hidden while judging, carried here for the analysis
          item_kind: it.kind, model_label: it.llm_label, reference_label: it.expert_label,
          model_probability: it.llm_prob}, answerOf(it.id, sec))));
    }
  });
  return items;
}
function exportOpen(){
  const out = [];
  CONTENT.sections.forEach(sec => {
    const fields = (sec.kind === "open" ? (sec.fields || []) : []).concat(sec.extra_open || []);
    fields.forEach(f => {
      const text = ((answers["open:" + f.id] || {}).comment || "");
      out.push({id: "open:" + f.id, section: sec.id, task: secNo(sec.id),
                task_title: sec.title || sec.nav, question: plainText(f.label),
                answered: !!text.trim(), answer: text});
    });
  });
  return out;
}
function exportFields(kind, prefix){
  const out = [];
  CONTENT.sections.forEach(sec => {
    (kind === "background" ? (sec.kind === "background" ? sec.fields || [] : [])
                           : (sec.followup || [])).forEach(f => {
      const a = answers[prefix + f.id] || {};
      out.push({id: f.id, question: plainText(f.label), options: f.options || null,
                multi: !!f.multi,
                answered: !!(a.value || (a.comment || "").trim()),
                value: a.value || null,
                values: Array.isArray(a.values) ? a.values : (a.value ? [a.value] : []),
                comment: a.comment || ""});
    });
  });
  return out;
}
function exportJSON(){
  const items = exportItems();
  const open = exportOpen();
  // One line per task, so the file says what was asked and how much of it was answered without
  // anyone having to count. An open-question task counts its questions; the rest count their items.
  const tasks = CONTENT.sections.filter(s => ["flags", "barriers", "adjudicate", "open"].includes(s.kind))
    .map(s => {
      const mine = (s.kind === "open" ? open : items).filter(i => i.section === s.id);
      return {task: secNo(s.id), section: s.id, title: s.title || s.nav, kind: s.kind,
              question: plainText(s.question || ""), choices: s.choices || null,
              items: mine.length, answered: mine.filter(i => i.answered).length};
    });
  const payload = {
    exported: new Date().toISOString(),
    workshop: CONTENT.mode,
    workshop_title: CONTENT.header_title || "",
    schema_version: 4,
    build: {run_mode: DATA.run_mode || null, model: DATA.model || null, built: DATA.built || null},
    progress: {answered: items.filter(i => i.answered).length, total: items.length},
    tasks: tasks,
    background: exportFields("background", "bg:"),
    followup: exportFields("followup", "fu:"),
    open_questions: open,
    items: items,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type: "application/json"});
  const url = URL.createObjectURL(blob); const a = document.createElement("a");
  const stamp = new Date().toISOString().slice(0, 10);
  a.href = url; a.download = `kanfit_workshop_${CONTENT.mode}_${stamp}.json`; a.click();
  URL.revokeObjectURL(url);
}
function resetAll(){ if(confirm("Alle antwoorden wissen?")){ answers={}; save(); renderBodies(); } }

renderShell(); renderBodies(); syncCancerBar(CONTENT.sections[0].id); syncStorageWarning();
